name: MathScope original slow roots 623935 general-s and 622820 obstruction (HOLD)
on:
  push:
    branches: [mathscope-m3m4-evidence-gates-20261023]
    paths:
      - '.github/workflows/mathscope-original-root623935-general-srep-20261025.yml'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/prove_original_monotone2_uniform_complex_tube.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/test_prove_original_monotone2_uniform_complex_tube.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/prove_original_root623935_general_srep_image.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/test_prove_original_root623935_general_srep_image.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/prove_original_root623935_autoselected_mesh.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/test_prove_original_root623935_autoselected_mesh.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/prove_original_root623935_overlapping_mesh_nonidentity.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/test_prove_original_root623935_overlapping_mesh_nonidentity.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/audit_original_root623935_switch_discontinuity.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/test_audit_original_root623935_switch_discontinuity.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/audit_original_root623935_integer_mesh_no_image_witness.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/test_audit_original_root623935_integer_mesh_no_image_witness.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/audit_original_root622820_free_coordinate_gap.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/test_audit_original_root622820_free_coordinate_gap.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  original-623935-general-srep-conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable original first FiveMap AST (not final A-D)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39988632325
          name: authenticated-first-fivemap-full-source-dag-replay-not-final-67
          path: ${{ runner.temp }}/source
      - name: Verify exact AST pins and conditional all-s slow-chart theorem
        env:
          MATHSCOPE_ORIGINAL_GRAPH_FILE: ${{ runner.temp }}/source/first-post-five-source-graph/original-source-nodes.jsonl.gz
        working-directory: research-ide/mathscope-m3/closure-evidence-20261023
        run: |
          python -m unittest -v test_prove_original_monotone2_uniform_complex_tube.py test_prove_original_root623935_general_srep_image.py test_prove_original_root623935_autoselected_mesh.py test_audit_original_root623935_integer_mesh_no_image_witness.py test_audit_original_root623935_switch_discontinuity.py test_prove_original_root623935_overlapping_mesh_nonidentity.py test_audit_original_root622820_free_coordinate_gap.py
          python prove_original_monotone2_uniform_complex_tube.py --output "$RUNNER_TEMP/ROOT2_COMPLEX_INVERSE_SOURCE_IMAGE_HOLD.json"
          python prove_original_root623935_general_srep_image.py --original-graph "$MATHSCOPE_ORIGINAL_GRAPH_FILE" --output "$RUNNER_TEMP/ROOT623935_GENERAL_SREP_CONDITIONAL_IMAGE_HOLD.json"
          python audit_original_root622820_free_coordinate_gap.py --original-graph "$MATHSCOPE_ORIGINAL_GRAPH_FILE" --output "$RUNNER_TEMP/ROOT622820_UNGUARDED_COORDINATE_COUNTEREXAMPLE_HOLD.json"
          python prove_original_root623935_autoselected_mesh.py --original-graph "$MATHSCOPE_ORIGINAL_GRAPH_FILE" --output "$RUNNER_TEMP/ROOT623935_S_REP_AUTOSELECTED_MESH_HOLD.json"
          python audit_original_root623935_integer_mesh_no_image_witness.py --original-graph "$MATHSCOPE_ORIGINAL_GRAPH_FILE" --output "$RUNNER_TEMP/ROOT623935_UNPAIRED_INTEGER_MESH_OUTSIDE_IMAGE_HOLD.json"
          python audit_original_root623935_switch_discontinuity.py --graph "$MATHSCOPE_ORIGINAL_GRAPH_FILE" --output "$RUNNER_TEMP/ROOT623935_SIGNED_Z_C0_SWITCH_OBSTRUCTION_HOLD.json"
          python prove_original_root623935_overlapping_mesh_nonidentity.py --graph "$MATHSCOPE_ORIGINAL_GRAPH_FILE" --output "$RUNNER_TEMP/ROOT623935_OVERLAPPING_PAIRED_NEIGHBOR_NONIDENTITY_HOLD.json"
      - name: Preserve conditional result, NOT a release or runtime-domain certificate
        uses: actions/upload-artifact@v4
        with:
          name: original-two-slow-roots-conditional-and-obstruction-HOLD
          path: |
            ${{ runner.temp }}/ROOT623935_GENERAL_SREP_CONDITIONAL_IMAGE_HOLD.json
            ${{ runner.temp }}/ROOT2_COMPLEX_INVERSE_SOURCE_IMAGE_HOLD.json
            ${{ runner.temp }}/ROOT622820_UNGUARDED_COORDINATE_COUNTEREXAMPLE_HOLD.json
            ${{ runner.temp }}/ROOT623935_S_REP_AUTOSELECTED_MESH_HOLD.json
            ${{ runner.temp }}/ROOT623935_UNPAIRED_INTEGER_MESH_OUTSIDE_IMAGE_HOLD.json
            ${{ runner.temp }}/ROOT623935_SIGNED_Z_C0_SWITCH_OBSTRUCTION_HOLD.json
            ${{ runner.temp }}/ROOT623935_OVERLAPPING_PAIRED_NEIGHBOR_NONIDENTITY_HOLD.json
