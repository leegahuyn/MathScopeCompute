name: M3 process completed original source graph artifact without repeating expensive original run
on:
  push:
    branches: [mathscope-m3m4-evidence-gates-20261023]
    paths:
      - '.github/workflows/mathscope-original-graph-postprocess-without-rerun-20261024.yml'
      - 'research-ide/mathscope-m3/post-signed-20261023/postprocess_original_full_graph.mjs'
      - 'research-ide/mathscope-m3/post-signed-20261023/original_native_semantic_definitions.mjs'
      - 'research-ide/mathscope-m3/post-signed-20261023/audit_original_native_semantic_closure.mjs'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/audit_original_56_Y_eta_domain.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/prove_original_n3_Q_rho_signs.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/prove_original_n3_t1_natural_domain.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/conditional_original_33Y_natural_tail.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/audit_source56_Y_algebraic_normal_forms.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/test_audit_source56_Y_algebraic_normal_forms.py'
  workflow_dispatch:
    inputs:
      original_run_id:
        description: Completed trusted source replay Actions run ID
        type: string
        required: true
        default: '39988632325'
permissions:
  contents: read
  actions: read
jobs:
  validate-and-count-original-reachable-kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.original_run_id || '39988632325' }}
      NODE_OPTIONS: --max-old-space-size=5200
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require completed authentic audit-branch original source run
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$RUNNER_TEMP/original-source-run-metadata.json"
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/original-source-run-metadata.json'));
          for(const [key,val] of Object.entries({
            id:Number(process.env.SOURCE_RUN_ID),
            status:'completed',
            conclusion:'success',
            head_branch:'mathscope-m3m4-evidence-gates-20261023',
            head_sha:'f8cb4034e86d7b669d52a6f2248aebba156b51b5',
            event:'push'
          }))if(x[key]!==val)throw Error('SOURCE_ARCHIVE_RUN_AUTHENTICITY_FAILED '+key);
          if(x.head_repository?.full_name!==process.env.GITHUB_REPOSITORY)
            throw Error('SOURCE_ARCHIVE_UNTRUSTED_REPOSITORY');
          console.log('PINNED_COMPLETED_ORIGINAL_SOURCE_RUN_VERIFIED');
          NODE
      - name: Download finished original full DAG and sealed function definitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-source-downloaded"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name authenticated-first-fivemap-full-source-dag-replay-not-final-67 \
            --dir "$RUNNER_TEMP/original-source-downloaded"
          manifest="$(find "$RUNNER_TEMP/original-source-downloaded" -type f -name original-source-export-manifest.json -print -quit)"
          test -n "$manifest"
          archive="$(dirname "$manifest")"
          printf '%s\n' "$archive" > "$RUNNER_TEMP/original-source-archive-path.txt"
          test -s "$archive/original-source-nodes.jsonl.gz"
          test -s "$archive/original-source-functions.json"
      - name: Independently hash and classify each original 3D physical and residual root
        shell: bash
        run: |
          set -euo pipefail
          dir="$(cat "$RUNNER_TEMP/original-source-archive-path.txt")"
          node research-ide/mathscope-m3/post-signed-20261023/postprocess_original_full_graph.mjs \
            "$dir" "$RUNNER_TEMP/first-fivemap-physical-root-native-operator-receipt.json"
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/first-fivemap-physical-root-native-operator-receipt.json'));
          if(!a.expanded_native_definition_semantic_closure||
            !Number.isSafeInteger(a.expanded_native_definition_semantic_closure.body_reachable_unique_nodes)||
            a.expanded_native_definition_semantic_closure.actual_native_function_ODE_Fourier_values_proved!==false||
            !Array.isArray(a.expanded_native_definition_semantic_closure.counts_by_physical_root)||
            a.expanded_native_definition_semantic_closure.counts_by_physical_root.length!==11)
            throw Error('EXTENDED_BODY_DEPENDENCY_RECEIPT_REQUIRED');
          if(!a.complete_full_stream_SHA256_verified||!a.captured_source_definitions_bytes_SHA256_verified||
            a.root_count!==11||a.actual_original_final_67_jet_interval_count!==0||
            a.release!=='HOLD')throw Error('ACTUAL_SOURCE_PROOF_SCOPE_UNSAFE');
          console.log(JSON.stringify({originalNodes:a.source_node_count,
            rootCount:a.root_count,firstNative:a.first_blocking_native_operation_by_reachable_count,
            distinctNative:a.native_operations_reachable_from_any_root.length,
            nativeBodyNodes:a.expanded_native_definition_semantic_closure.body_reachable_unique_nodes,
            unresolvedNative:a.expanded_native_definition_semantic_closure.unresolved_native_function_calls,
            final67:0}));
          NODE
      - name: Certify source Y=4 and Lambda*Xa=4 source algebra and enumerate 56 real eta-domain obligations
        shell: bash
        run: |
          set -euo pipefail
          dir="$(cat "$RUNNER_TEMP/original-source-archive-path.txt")"
          python research-ide/mathscope-m3/closure-evidence-20261023/audit_original_56_Y_eta_domain.py \
            "$dir" "$RUNNER_TEMP/first-fivemap-physical-root-native-operator-receipt.json" \
            "$RUNNER_TEMP/real-56-source-Y-eta-domain-rewrite-receipt.json"
          python - <<'PY'
          import json,os
          p=os.environ['RUNNER_TEMP']+'/real-56-source-Y-eta-domain-rewrite-receipt.json'
          x=json.load(open(p))
          assert x['unique_Y_eta_pairs']==56 and x['natural_calls']==523
          assert x['original_source_Y_interval_0_to_5_algebraically_certified_calls']>=33
          assert x['final_original_67_jets_certified']==0
          assert x['release']=='HOLD'
          print('SHA_PINNED_REAL56_CERTIFICATION_SCOPE_CHECKED')
          PY
      - name: Compute all exactly source-bounded 33 natural-series call tail factors without coefficient norm promotion
        shell: bash
        run: |
          set -euo pipefail
          python research-ide/mathscope-m3/closure-evidence-20261023/conditional_original_33Y_natural_tail.py \
            "$RUNNER_TEMP/real-56-source-Y-eta-domain-rewrite-receipt.json" \
            "$RUNNER_TEMP/real-33-source-Y-interval-natural-tail-conditional.json"
          python - <<'PY'
          import os,json
          from fractions import Fraction as F
          r=json.load(open(os.environ['RUNNER_TEMP']+'/real-33-source-Y-interval-natural-tail-conditional.json'))
          assert r['original_Y_interval_algebraically_certified_calls']==33
          assert not r['source_coefficient_Brho_norm_le_Q_proven']
          assert not r['shared_complex_eta_domain_proven']
          assert r['finite_original_natural_coefficients_numerically_certified']==0
          assert r['final_original_67_jet_intervals_certified']==0
          candidates={(q['Y_root'],q['m']):F(q['conditional_scaled_tail_coefficient'])
                      for q in r['source_derivative_rows']}
          assert candidates[474,4]==F(204,15869140625)
          assert candidates[3628,5]==F(112150186033152,114217653172314453125)
          print('33_SOURCE_Y_BOUNDS_WITH_CONDITIONAL_TAILS_PROVEN')
          PY
      - name: Normalize all 56 authentic Y algebraically, preserve real logarithm guards, and keep missing 490 OPEN
        shell: bash
        run: |
          set -euo pipefail
          (cd research-ide/mathscope-m3/closure-evidence-20261023 && python -m unittest -v test_audit_source56_Y_algebraic_normal_forms)
          dir="$(cat "$RUNNER_TEMP/original-source-archive-path.txt")"
          python research-ide/mathscope-m3/closure-evidence-20261023/audit_source56_Y_algebraic_normal_forms.py \
            "$dir" "$RUNNER_TEMP/real-56-source-Y-eta-domain-rewrite-receipt.json" \
            "$RUNNER_TEMP/real-56-source-Y-43-algebraic-normal-forms.json"
          python - <<'PY'
          import json,os
          x=json.load(open(os.environ['RUNNER_TEMP']+'/real-56-source-Y-43-algebraic-normal-forms.json'))
          assert x['source_pairs']==56 and x['source_calls']==523
          assert x['different_algebraic_signatures']==43
          assert x['Y_bound_certified_calls']==33 and x['remaining_unproved_Y_bounds']==490
          g=next(i for i in x['groups'] if i['normal_form']=='COORD:X * Lambda')
          assert g['pairs']==8 and g['calls']==114 and g['Y_bound_certified_calls']==0
          assert not x['coefficient_Brho_norm_le_Q_proved']
          assert x['final_67_closed_cell_jets_certified']==0 and x['release']=='HOLD'
          print('REAL_FIRST_FIVEMAP_SOURCE_56_NORMAL_FORMS_SHA_REPLAY_PASS')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-archive-physical-root-ode-volterra-fourier-counts-not-final67
          path: |
            ${{ runner.temp }}/first-fivemap-physical-root-native-operator-receipt.json
            ${{ runner.temp }}/original-source-run-metadata.json
            ${{ runner.temp }}/real-56-source-Y-eta-domain-rewrite-receipt.json
            ${{ runner.temp }}/real-33-source-Y-interval-natural-tail-conditional.json
            ${{ runner.temp }}/real-56-source-Y-43-algebraic-normal-forms.json
          if-no-files-found: warn
          retention-days: 30
