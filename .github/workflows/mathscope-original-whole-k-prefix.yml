name: MathScope original whole-K coefficient prefixes
on:
  push:
    branches: [mathscope-cd-axial-source-bridge-20261029]
    paths:
      - '.github/workflows/mathscope-original-whole-k-prefix.yml'
      - 'tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas/replay_original_whole_k_prefix.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-whole-k-prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        prefix: ${{ fromJSON(github.event_name == 'push' && '[3,4]' || '[0,3,4]') }}
    env:
      NODE_OPTIONS: --max-old-space-size=6100
      ORIGINAL_SOURCE_COMMIT: f8cb4034e86d7b669d52a6f2248aebba156b51b5
    steps:
      - uses: actions/checkout@v4
        with:
          path: evidence
          persist-credentials: false
          sparse-checkout: tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas
      - uses: actions/checkout@v4
        with:
          ref: f8cb4034e86d7b669d52a6f2248aebba156b51b5
          path: original
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the original current and pressure prefix
        working-directory: original
        env:
          ORIGINAL_PREFIX: ${{ matrix.prefix }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORIGINAL_SOURCE_COMMIT"
          git diff --quiet --exit-code HEAD --
          script=replay_original_whole_k_prefix.mjs
          target="research-ide/mathscope-m3/extended-signed-run-20261023/$script"
          cp "../evidence/tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas/$script" "$target"
          free -b
          limits="$(python3 - <<'PY'
          from pathlib import Path
          from os import environ
          gib = 1024**3
          mem = dict(line.split(":", 1) for line in Path("/proc/meminfo").read_text().splitlines())
          available = int(mem["MemAvailable"].split()[0]) * 1024
          root = Path("/sys/fs/cgroup")
          for limit_path, usage_path in (("memory.max", "memory.current"),
                                         ("memory/memory.limit_in_bytes", "memory/memory.usage_in_bytes")):
              limit, usage = root / limit_path, root / usage_path
              if limit.exists() and usage.exists():
                  cap = limit.read_text().strip()
                  if cap != "max":
                      available = min(available, int(cap) - int(usage.read_text()))
          fourth = environ["ORIGINAL_PREFIX"] == "4"
          roomy = available >= 11 * gib
          more_room = fourth and available >= 14 * gib
          prefix = int(environ["ORIGINAL_PREFIX"])
          print((12 if more_room else 9 if roomy else 6) * gib,
                11000 if more_room else 8100 if roomy else 6100,
                12000000 if more_room else 5000000,
                16000000 if more_room else 8000000 if roomy and prefix == 3 else 4000000)
          PY
          )"
          read -r MATHSCOPE_PREFIX_MAX_RSS_BYTES heap_mb MATHSCOPE_PREFIX_FAMILY_MAX_NODES MATHSCOPE_PREFIX_BAND_MAX_NODES <<< "$limits"
          export MATHSCOPE_PREFIX_MAX_RSS_BYTES MATHSCOPE_PREFIX_FAMILY_MAX_NODES MATHSCOPE_PREFIX_BAND_MAX_NODES
          printf 'RSS=%s bytes; V8 old-space=%s MiB; original family nodes=%s; band nodes=%s\n' "$MATHSCOPE_PREFIX_MAX_RSS_BYTES" "$heap_mb" "$MATHSCOPE_PREFIX_FAMILY_MAX_NODES" "$MATHSCOPE_PREFIX_BAND_MAX_NODES"
          if [ "$MATHSCOPE_PREFIX_BAND_MAX_NODES" -gt 4000000 ]; then
            out="$RUNNER_TEMP/mathscope-whole-k"
            mkdir -p "$out"
            band=research-ide/mathscope-m3/navier/source-global-band.mjs
            python3 "../evidence/tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas/prepare_wider_band_budget.py" "$band" "$out/band-budget-overlay.json"
            test "$(git diff --name-only HEAD --)" = "$band"
          fi
          node --check "$target"
          node --max-old-space-size="$heap_mb" --expose-gc "$target" "$RUNNER_TEMP/mathscope-whole-k" "$ORIGINAL_SOURCE_COMMIT" "$ORIGINAL_PREFIX"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathscope-whole-k-N${{ matrix.prefix }}
          path: ${{ runner.temp }}/mathscope-whole-k/**
          if-no-files-found: warn
          retention-days: 30
