name: MathScope original whole-K coefficient prefixes
on:
  push:
    branches: [mathscope-cd-axial-source-bridge-20261029]
    paths:
      - '.github/workflows/mathscope-original-whole-k-prefix.yml'
      - 'tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas/replay_original_whole_k_prefix.mjs'
      - 'tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas/replay_whole_k_primary_c3.mjs'
      - 'tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas/prepare_diagonal_materialization.py'
  workflow_dispatch:
    inputs:
      phase:
        description: Source construction to replay
        type: choice
        options: [prefix, primary-potential-c3, primary-c3, primary-c3-order4]
        default: prefix
permissions:
  contents: read
jobs:
  original-whole-k-prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        prefix: ${{ fromJSON((github.event_name == 'push' || inputs.phase == 'primary-potential-c3' || inputs.phase == 'primary-c3') && '[2,3]' || inputs.phase == 'primary-c3-order4' && '[4]' || '[0,2,3,4]') }}
    env:
      NODE_OPTIONS: --max-old-space-size=6100
      ORIGINAL_SOURCE_COMMIT: f8cb4034e86d7b669d52a6f2248aebba156b51b5
    steps:
      - uses: actions/checkout@v4
        with:
          path: evidence
          persist-credentials: false
          sparse-checkout: tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas
      - uses: actions/checkout@v4
        with:
          ref: f8cb4034e86d7b669d52a6f2248aebba156b51b5
          path: original
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the original finite source family
        working-directory: original
        env:
          ORIGINAL_PREFIX: ${{ matrix.prefix }}
          ORIGINAL_PHASE: ${{ github.event_name == 'push' && 'primary-potential-c3' || inputs.phase }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORIGINAL_SOURCE_COMMIT"
          git diff --quiet --exit-code HEAD --
          script=replay_original_whole_k_prefix.mjs
          target="research-ide/mathscope-m3/extended-signed-run-20261023/$script"
          cp "../evidence/tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas/$script" "$target"
          out="$RUNNER_TEMP/mathscope-whole-k"
          mkdir -p "$out"
          if [ "$ORIGINAL_PHASE" != prefix ]; then
            export MATHSCOPE_WHOLE_K_PRIMARY_ORDER=3
            if [ "$ORIGINAL_PHASE" = primary-potential-c3 ]; then
              export MATHSCOPE_WHOLE_K_PRIMARY_ORDER=2
            fi
            helper=../evidence/tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas
            cp "$helper/replay_whole_k_primary_c3.mjs" "$(dirname "$target")/"
            python3 "$helper/prepare_iterative_norm_import.py" . "$out/iterative-norm-import-overlay.json"
            node "$helper/check_iterative_norm_import.mjs" . | tee "$out/iterative-norm-import-check.log"
          fi
          if [ "$ORIGINAL_PREFIX" != 0 ]; then
            export MATHSCOPE_PREFIX_DIAGONAL_ONLY=1
            python3 "../evidence/tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas/prepare_diagonal_materialization.py" . "$out/diagonal-overlay.json"
          fi
          free -b
          limits="$(python3 - <<'PY'
          from pathlib import Path
          from os import environ
          gib = 1024**3
          mem = dict(line.split(":", 1) for line in Path("/proc/meminfo").read_text().splitlines())
          available = int(mem["MemAvailable"].split()[0]) * 1024
          root = Path("/sys/fs/cgroup")
          for limit_path, usage_path in (("memory.max", "memory.current"),
                                         ("memory/memory.limit_in_bytes", "memory/memory.usage_in_bytes")):
              limit, usage = root / limit_path, root / usage_path
              if limit.exists() and usage.exists():
                  cap = limit.read_text().strip()
                  if cap != "max":
                      available = min(available, int(cap) - int(usage.read_text()))
          fourth = environ["ORIGINAL_PREFIX"] == "4"
          primary = environ.get("MATHSCOPE_WHOLE_K_PRIMARY_ORDER") in {"2", "3"}
          roomy = available >= 11 * gib
          prefix = int(environ["ORIGINAL_PREFIX"])
          more_room = (prefix >= 3 or primary) and available >= 14 * gib
          print((12 if more_room else 9 if roomy else 6) * gib,
                11000 if more_room else 8100 if roomy else 6100,
                12000000 if more_room and (fourth or primary) else 5000000,
                16000000 if more_room and (fourth or primary) else
                8000000 if roomy and (prefix == 3 or primary) else 4000000)
          PY
          )"
          read -r MATHSCOPE_PREFIX_MAX_RSS_BYTES heap_mb MATHSCOPE_PREFIX_FAMILY_MAX_NODES MATHSCOPE_PREFIX_BAND_MAX_NODES <<< "$limits"
          export MATHSCOPE_PREFIX_MAX_RSS_BYTES MATHSCOPE_PREFIX_FAMILY_MAX_NODES MATHSCOPE_PREFIX_BAND_MAX_NODES
          printf 'RSS=%s bytes; V8 old-space=%s MiB; original family nodes=%s; band nodes=%s\n' "$MATHSCOPE_PREFIX_MAX_RSS_BYTES" "$heap_mb" "$MATHSCOPE_PREFIX_FAMILY_MAX_NODES" "$MATHSCOPE_PREFIX_BAND_MAX_NODES"
          if [ "$MATHSCOPE_PREFIX_BAND_MAX_NODES" -gt 4000000 ]; then
            band=research-ide/mathscope-m3/navier/source-global-band.mjs
            guard=../evidence/tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas/prepare_wider_band_budget.py
            python3 "$guard" "$band" "$out/band-budget-overlay.json"
            if [ "$MATHSCOPE_PREFIX_BAND_MAX_NODES" -gt 8000000 ]; then
              expressions=research-ide/mathscope-m2/navier/actual-residual-order-induction-expressions.mjs
              python3 "$guard" "$expressions" "$out/graph-copy-budget-overlay.json"
            fi
          fi
          python3 - "$out" <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, sys
          out = Path(sys.argv[1])
          checked = {}
          diagonal = out / "diagonal-overlay.json"
          if diagonal.exists():
              checked.update({"research-ide/mathscope-m2/navier/" + n: r["patchedSHA256"]
                              for n, r in json.loads(diagonal.read_bytes())["files"].items()})
          for file, name in (("band-budget-overlay.json", "mathscope-m3/navier/source-global-band.mjs"),
                             ("graph-copy-budget-overlay.json", "mathscope-m2/navier/actual-residual-order-induction-expressions.mjs"),
                             ("iterative-norm-import-overlay.json", "mathscope-m2/navier/actual-residual-order-induction-norms.mjs")):
              receipt = out / file
              if receipt.exists():
                  checked["research-ide/" + name] = json.loads(receipt.read_bytes())["newSHA256"]
          actual = subprocess.check_output(["git", "diff", "--name-only", "HEAD", "--"], text=True).splitlines()
          assert set(actual) == set(checked)
          assert all(hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest
                     for name, digest in checked.items())
          PY
          node --check "$target"
          if [ "$ORIGINAL_PHASE" != prefix ]; then
            node --check "$(dirname "$target")/replay_whole_k_primary_c3.mjs"
          fi
          node --max-old-space-size="$heap_mb" --expose-gc "$target" "$out" "$ORIGINAL_SOURCE_COMMIT" "$ORIGINAL_PREFIX"
          if [ "$ORIGINAL_PHASE" != prefix ]; then
            python3 ../evidence/tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas/verify_primary_c3.py "$out"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathscope-whole-k-${{ (github.event_name == 'push' || inputs.phase != 'prefix') && 'primary-C3-' || '' }}N${{ matrix.prefix }}
          path: ${{ runner.temp }}/mathscope-whole-k/**
          if-no-files-found: warn
          retention-days: 30
