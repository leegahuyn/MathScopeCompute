name: M3 source-private full-DAG plus extended native-definition capture
on:
  push:
    branches: [mathscope-m3m4-evidence-gates-20261023]
    paths:
      - '.github/workflows/mathscope-signed-real-corrected-full-20261023.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-original-full-current-signed:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      NODE_OPTIONS: --max-old-space-size=5200
      M3_MAX_MINUTES: '115'
      M3_MAX_RSS_GB: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply source-pinned original Signed fixes without altering PR30 or bypassing private seals
        run: |
          set -euo pipefail
          echo 'd23a2ac3b56412f176c3f86a7303a623fe07931453aff0e55ddf1730e34ee312  research-ide/mathscope-m3/staged-patches-20261023/PR30_Cumulative_Signed162_Cor85_TemporalFrontier.patch' | sha256sum -c
          git apply research-ide/mathscope-m3/staged-patches-20261023/PR30_Cumulative_Signed162_Cor85_TemporalFrontier.patch
          git apply research-ide/mathscope-m3/pin-test-hotfix-20261023/PR30_RealCheckout_PinTest_EnvPortable.patch
          git apply research-ide/mathscope-m3/temporal-finite-20261023/PR30_Cor85_SameSeal_NoDuplicate.patch
          git apply research-ide/mathscope-m3/temporal-finite-20261023/PR30_Audit_Real81Cover_String_Flatness.patch
          git apply --check research-ide/mathscope-m3/actual-audit-fix-20261023/PR30_NativeCoupledField_Handle_And_ClonedGuard.patch
          git apply research-ide/mathscope-m3/actual-audit-fix-20261023/PR30_NativeCoupledField_Handle_And_ClonedGuard.patch
          cp research-ide/mathscope-m3/tangency-proof-20261023/generic-signed-source-kernel.fixed.mjs research-ide/mathscope-m3/navier/generic-signed-source-kernel.mjs
          cp research-ide/mathscope-m3/tangency-proof-20261023/signed-source-frame-tangency.mjs research-ide/mathscope-m3/navier/signed-source-frame-tangency.mjs
          node --input-type=module -e "import {verifyPR30OriginalSourceFiles} from './research-ide/mathscope-m3/navier/source-signed-162-pr30-pins.mjs'; const x=await verifyPR30OriginalSourceFiles(); if(x.verifiedFiles.length!==29)process.exit(2); console.log('ORIGINAL_29_GIT_BLOBS_VALIDATED')"
      - name: Verify real source native 81-cover field descriptors, and prepare gated Temporal/FiveMap
        run: |
          set -euo pipefail
          node --check research-ide/mathscope-m3/navier/source-signed-162-successor-audit.mjs
          node --check research-ide/mathscope-m3/post-signed-20261023/source-signed-actual-temporal-inverse.mjs
          node --check research-ide/mathscope-m3/post-signed-20261023/source-signed-actual-five-map.mjs
          grep -F 'band,template,bump:b,updated:signedUpdated' research-ide/mathscope-m3/post-signed-20261023/source-signed-actual-five-map.mjs
          grep -F 'divergence=G.add(De(rawDeltaBeta,1),Dz(gammaDesired))' research-ide/mathscope-m3/post-signed-20261023/source-signed-actual-five-map.mjs
          node --test --test-reporter=tap research-ide/mathscope-m3/tests/original-signed-162-native-field-ids.test.mjs | tee "$RUNNER_TEMP/native-preflight.tap"
          node --check research-ide/mathscope-m3/post-signed-20261023/source-postfive-full-3d-residual.mjs
          node --test --test-reporter=tap research-ide/mathscope-m3/post-signed-20261023/postfive-original-receipt-gate.test.mjs
          node --test --test-reporter=tap research-ide/mathscope-m3/post-signed-20261023/source-postfive-full-3d-residual.test.mjs
          node --check research-ide/mathscope-m3/post-signed-20261023/source-postfive-direct-split.mjs
          node --test --test-reporter=tap research-ide/mathscope-m3/post-signed-20261023/source-postfive-direct-split.test.mjs
          node --check research-ide/mathscope-m3/extended-signed-run-20261023/run_real_original_signed162.mjs
          node --check research-ide/mathscope-m3/post-signed-20261023/export_original_source_graph.mjs
          node --check research-ide/mathscope-m3/post-signed-20261023/audit_original_source_graph_replay.mjs
          node --test research-ide/mathscope-m3/post-signed-20261023/export_original_source_graph.test.mjs
      - name: Run full original Signed Temporal FiveMap full3D and independent direct-split roots
        run: |
          set -o pipefail
          timeout -s TERM 7200s env M3_EXPORT_SOURCE_GRAPH=1 M3_SOURCE_GRAPH_EXPORT_DIR="$RUNNER_TEMP/first-post-five-source-graph" node --expose-gc research-ide/mathscope-m3/extended-signed-run-20261023/run_real_original_signed162.mjs "$RUNNER_TEMP/m3-original-signed-temporal-five-after-native-field-fix.json"
      - name: Audit immutable replay graph and enumerate missing interval kernels
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {auditOriginalSourceReplay} from './research-ide/mathscope-m3/post-signed-20261023/audit_original_source_graph_replay.mjs';
          import {writeFileSync} from 'node:fs';
          const dir=process.env.RUNNER_TEMP+'/first-post-five-source-graph';
          const r=await auditOriginalSourceReplay(dir);
          writeFileSync(dir+'/source-numeric-operator-inventory.json',JSON.stringify(r,null,2)+'\n');
          if(r.final_all_cycle_A_b_p_serialized!==false||r.final_67_numeric_certified!==0||
            r.function_registry_capture_kind!=='EXTENDED_COUPLED_FACADE'||
            r.extended_coupled_registry_sha256_verified!==true||
            r.native_extended_function_bodies_structurally_present!==true)
            throw Error('Missing exact extended native function bodies or unsafe final-field promotion');
          console.log(JSON.stringify({nodeCount:r.node_count,distinctOps:Object.keys(r.operation_histogram).length,
              dedicatedNumericOpCount:r.operators_requiring_dedicated_interval_interpreters.length,originalFinal67:0,release:'HOLD'}));
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-first-fivemap-full-source-dag-replay-not-final-67
          path: |
            ${{ runner.temp }}/m3-original-signed-temporal-five-after-native-field-fix.json
            ${{ runner.temp }}/native-preflight.tap
            ${{ runner.temp }}/first-post-five-source-graph/**
          if-no-files-found: warn
          retention-days: 30
