name: Explicit English Release Manifest Refresh

on:
  push:
    branches:
      - mathscope-m3-n6-cloud-20261014
    paths:
      - ".github/workflows/refresh-english-release-manifest.yml"

permissions:
  contents: write

concurrency:
  group: refresh-english-release-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-reviewed-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source pins and translations, then explicitly regenerate manifest
        run: |
          python3 research-ide/tools/verify_english_release.py --write-manifest
          python3 research-ide/tools/verify_english_release.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("research-ide/SOURCE_TRANSLATION_MANIFEST.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({
              "manifest": str(p),
              "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              "editionArtifactCount": data["editionArtifactCount"],
              "postV54AddonCount": data["postV54AddonCount"],
              "sourceSelection": data["sourceSelection"],
              "evidenceBoundary": data["evidenceBoundary"],
          }, indent=2))
          PY

      - name: Commit only the regenerated manifest
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git diff --check
          git add research-ide/SOURCE_TRANSLATION_MANIFEST.json
          if git diff --cached --quiet; then
            echo "Manifest already matches the validated source tree; no commit needed."
            exit 0
          fi
          git diff --cached --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh English release artifact manifest after source validation"
          git push origin "HEAD:${BRANCH_NAME}"
