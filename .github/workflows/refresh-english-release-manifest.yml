name: One-time validated English manifest refresh

on:
  push:
    branches:
      - mathscope-m3-n6-cloud-20261014
    paths:
      - "research-ide/mathscope-m4/recovery-20261020/REFRESH_ENGLISH_MANIFEST_ONCE"

permissions:
  contents: write

concurrency:
  group: mathscope-one-time-manifest-refresh
  cancel-in-progress: false

jobs:
  validate-regenerate-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bounded-verifier dependencies
        run: python -m pip install mpmath sympy

      - name: Remove one-time trigger before computing tracked artifact membership
        run: |
          git rm -- research-ide/mathscope-m4/recovery-20261020/REFRESH_ENGLISH_MANIFEST_ONCE
          git rm -- .github/workflows/refresh-english-release-manifest.yml

      - name: Regenerate staging artifacts from pinned source evidence
        run: |
          mkdir -p "$RUNNER_TEMP/mathscope-final-sync"
          python research-ide/mathscope-m4/acceptance-review-20261019/sync_m3_m4_and_v031.py --write --report "$RUNNER_TEMP/mathscope-final-sync/STAGING.json"
          node research-ide/mathscope-m4/acceptance-review-20261019/verify_m4_modules.mjs > "$RUNNER_TEMP/mathscope-final-sync/M4_MODULES.json"
          python research-ide/mathscope-m4/recovery-20261020/verify_sync_readiness.py --report "$RUNNER_TEMP/mathscope-final-sync/READINESS.json"

      - name: Explicitly refresh and re-verify the English release manifest
        run: |
          python research-ide/tools/verify_english_release.py --write-manifest
          python research-ide/tools/verify_english_release.py

      - name: Commit validated generated artifacts and manifest
        env:
          BRANCH_NAME: \${{ github.ref_name }}
        run: |
          git diff --check
          git add public/websitepublisher-v118-followup-bundle.json public/v0.3.1-sync-status.html research-ide/SOURCE_TRANSLATION_MANIFEST.json
          git add -u
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No staged changes after successful verification."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh validated publisher staging and English manifest"
          git push origin "HEAD:\${BRANCH_NAME}"
