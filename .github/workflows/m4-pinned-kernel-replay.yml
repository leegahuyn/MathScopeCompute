name: MathScope M4 pinned Lean kernel replay

on:
  workflow_dispatch:
  push:
    paths:
      - 'research-ide/mathscope-m4/*.mjs'
      - 'research-ide/mathscope-m4/tools/**'
      - 'research-ide/mathscope-m4/tests/**'
      - 'research-ide/mathscope-m0/lean/**'
      - 'research-ide/mathscope-m0/proof.mjs'
      - '.github/workflows/m4-pinned-kernel-replay.yml'
  pull_request:
    paths:
      - 'research-ide/mathscope-m4/*.mjs'
      - 'research-ide/mathscope-m4/tools/**'
      - 'research-ide/mathscope-m4/tests/**'
      - 'research-ide/mathscope-m0/lean/**'
      - 'research-ide/mathscope-m0/proof.mjs'
      - '.github/workflows/m4-pinned-kernel-replay.yml'

permissions:
  contents: read

jobs:
  pinned-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research-ide/mathscope-m0
            research-ide/mathscope-m4
            .github/workflows/m4-pinned-kernel-replay.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise original-criterion evidence guards
        shell: bash
        run: >-
          node --test --test-reporter=tap --test-concurrency=1
          research-ide/mathscope-m4/tests/acceptance.test.mjs
          research-ide/mathscope-m4/tests/pinned-kernel-contract.test.mjs
          | tee "$RUNNER_TEMP/m4-guard-tests.tap"
      - name: Run actual finite and conditional Lean targets on their original pins
        env:
          M4_REPLAY_DIRECTORY: ${{ runner.temp }}/mathscope-m4-pinned-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          node research-ide/mathscope-m4/tools/pinned-kernel-replay.mjs
          --install-official
          --work-dir "$M4_REPLAY_DIRECTORY"
          --out "research-ide/mathscope-m4/evidence/hosted-pinned-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve successful, failed, and timed-out replay receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-pinned-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research-ide/mathscope-m4/evidence/hosted-pinned-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/m4-guard-tests.tap
          if-no-files-found: error
          retention-days: 30
