name: N6 actual native domains and source support frontier
on:
  push:
    branches: [mathscope-m3-n6-cloud-20261014]
    paths:
      - 'tools/n6-native-domain-frontier-20261015/*.py'
      - 'tools/n6-native-domain-frontier-20261015/*.mjs'
      - '.github/workflows/m3-n6-native-domain-frontier.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: n6-native-domains-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/n6-native-domain-frontier-20261015/*
            /tools/n6-domain-transport-20261015/*
            /research-ide/mathscope-m0/*.mjs
            /research-ide/mathscope-m1/navier/numerics.mjs
            /research-ide/mathscope-m1/navier/followup-20261010-symbolic-gluing/certify_symbolic_b8.py
            /research-ide/mathscope-m1/navier/followup-20261010-symbolic-gluing/certify_symbolic_c2.py
            /research-ide/mathscope-m1/navier/followup-next/uniform-gluing/dyadic_interval.py
            /research-ide/mathscope-m1/navier/followup-next/uniform-gluing/logarithmic_interval.py
            /research-ide/mathscope-m1/navier/followup-next/uniform-gluing/certify_uniform_moment_map.py
            /research-ide/mathscope-m1/navier/followup-20261010-outer-reselection/OUTER_DERIVATION.md
            /research-ide/mathscope-m1/navier/followup-20261010-outer-reselection/check_outer_envelopes.py
            /research-ide/mathscope-m2/navier/*.mjs
            /research-ide/mathscope-m3/evidence/n6-continuation-20261015/FIRST26_FRONTIER_RUN38734477166.json
            /research-ide/mathscope-m3/evidence/n6-continuation-20261015/run-38734477166/ACTUAL_COMPLETED_LEADING_DOMAINS.json
            /research-ide/mathscope-m3/evidence/n6-continuation-20261015/run-38734477166/ACTUAL_ORDER_ONE_PRIMITIVE_CALCULUS.json
            /research-ide/mathscope-m3/evidence/n6-continuation-20261015/run-38734477166/ACTUAL_ORDER_ONE_GLOBAL_REGULARITY.json
            /research-ide/mathscope-m3/evidence/n6-continuation-20261015/run-38734477166/ACTUAL_ORDER_ONE_PRIMITIVE_BINDING.json
            /research-ide/mathscope-m3/evidence/n6-continuation-20261015/run-38734477166/NATIVE_DOMAIN_DIAGNOSTICS.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install sympy==1.14.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38673138045
          name: n6-domain-full-source-38673138045
          path: ${{ runner.temp }}/source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38694948443
          name: n6-remaining-closure-38694948443
          path: ${{ runner.temp }}/prior
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38689780299
          name: n6-regularity-source-38689780299
          path: ${{ runner.temp }}/kernels
      - name: Verify prior execution artifacts
        env:
          PRIOR: ${{ runner.temp }}/prior
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['PRIOR']);r=json.loads((root/'RESULT_SHA256.json').read_text())
          assert r['commit']=='2f88dd1fc36365a5840fc7a9fab486ab868a8085' and r['run']=='38694948443'
          for row in r['files']:
              raw=(root/row['path']).read_bytes()
              assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256'],row['path']
          tests=json.loads((root/'TESTS.json').read_text());assert tests['successful'] and tests['passed']==72
          PY
      - name: Extract all actual natural arguments and original source domains
        id: original_source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          python tools/n6-native-domain-frontier-20261015/native_domain_extract.py \
            --source "$RUNNER_TEMP/source" \
            --stage3 tools/n6-domain-transport-20261015/verify_domain_transport.py \
            --out "$RUNNER_TEMP/result" 2>&1 | tee "$RUNNER_TEMP/result/DOMAIN_EXECUTION.log"
      - name: Source-bound basic gate
        id: gate_basic
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tool=tools/n6-native-domain-frontier-20261015
          {
            python -m unittest discover -s "$tool" -p test_native_domain_extract.py -v 2>&1 | tee "$RUNNER_TEMP/result/DOMAIN_TESTS.log"
            python "$tool/verify_regularity_mechanisms.py" --kernels "$RUNNER_TEMP/kernels" \
              --extract "$RUNNER_TEMP/prior/COMPACT_JET_PDE_SOURCE.json" --out "$RUNNER_TEMP/result/REGULARITY_MECHANISMS.json"
            python "$tool/jet_pde_native_chart.py" --extract "$RUNNER_TEMP/prior/COMPACT_JET_PDE_SOURCE.json" \
              --out "$RUNNER_TEMP/result/NATIVE_CHART_DERIVATIVES.json"
            python "$tool/jet_pde_assembly_certificate.py" --extract "$RUNNER_TEMP/prior/COMPACT_JET_PDE_SOURCE.json" \
              --out "$RUNNER_TEMP/result/CONDITIONAL_ASSEMBLY_ALGEBRA.json"
          } 2>&1 | tee "$RUNNER_TEMP/result/GATE_basic.log"
      - name: Source-bound natural gate
        id: gate_natural
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tool=tools/n6-native-domain-frontier-20261015
          {
            python "$tool/actual_picard_structure.py" --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" \
              --out "$RUNNER_TEMP/result/ACTUAL_PICARD_STRUCTURE.json"
            python "$tool/actual_natural_proof.py" --payload "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" \
              --arguments "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" \
              --kernels "$RUNNER_TEMP/kernels" --out "$RUNNER_TEMP/result/ACTUAL_NATURAL_MAJORANT.json"
            node "$tool/actual_natural_proof.kernel-probe.mjs" --kernel-root "$PWD" \
              --payload "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" --out "$RUNNER_TEMP/result/ACTUAL_NATURAL_KERNEL_BINDING.json"
          } 2>&1 | tee "$RUNNER_TEMP/result/GATE_natural.log"
      - name: Source-bound support gate
        id: gate_support
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tool=tools/n6-native-domain-frontier-20261015
          {
            python "$tool/jet_pde_support_extract.py" --source-db "$RUNNER_TEMP/result/native-source-cache.sqlite" \
              --stage3 tools/n6-domain-transport-20261015/verify_domain_transport.py \
              --compact "$RUNNER_TEMP/prior/COMPACT_JET_PDE_SOURCE.json" --out "$RUNNER_TEMP/result/COMPACT_162_SUPPORT.json"
            python "$tool/actual_support_proof.py" --support "$RUNNER_TEMP/result/COMPACT_162_SUPPORT.json" \
              --compact "$RUNNER_TEMP/prior/COMPACT_JET_PDE_SOURCE.json" --out "$RUNNER_TEMP/result/ACTUAL_SUPPORT_PROOF.json"
            python "$tool/actual_indexed_derivative_proof.py" --support "$RUNNER_TEMP/result/COMPACT_162_SUPPORT.json" \
              --compact "$RUNNER_TEMP/prior/COMPACT_JET_PDE_SOURCE.json" --support-proof "$RUNNER_TEMP/result/ACTUAL_SUPPORT_PROOF.json" \
              --out "$RUNNER_TEMP/result/ACTUAL_INDEXED_DERIVATIVES.json"
          } 2>&1 | tee "$RUNNER_TEMP/result/GATE_support.log"
      - name: Source-bound heat gate
        id: gate_heat
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tool=tools/n6-native-domain-frontier-20261015
          {
            python "$tool/actual_heat_regularization.py" --source-db "$RUNNER_TEMP/result/native-source-cache.sqlite" \
              --stage3 tools/n6-domain-transport-20261015/verify_domain_transport.py \
              --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" --out "$RUNNER_TEMP/result/ACTUAL_HEAT_REGULARITY.json"
          } 2>&1 | tee "$RUNNER_TEMP/result/GATE_heat.log"
      - name: Source-bound loop gate
        id: gate_loop
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tool=tools/n6-native-domain-frontier-20261015
          {
            node "$tool/actual_loop_native_probe.mjs" --kernel-root "$PWD" \
              --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" \
              --compact "$RUNNER_TEMP/prior/COMPACT_JET_PDE_SOURCE.json" --out "$RUNNER_TEMP/result/ACTUAL_LOOP_NATIVE_BINDING.json"
            python "$tool/actual_loop_regularity.py" --kernels "$RUNNER_TEMP/kernels" \
              --payload "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" \
              --compact "$RUNNER_TEMP/prior/COMPACT_JET_PDE_SOURCE.json" \
              --binding "$RUNNER_TEMP/result/ACTUAL_LOOP_NATIVE_BINDING.json" --out "$RUNNER_TEMP/result/ACTUAL_LOOP_REGULARITY.json"
          } 2>&1 | tee "$RUNNER_TEMP/result/GATE_loop.log"
      - name: Source-bound picard gate
        id: gate_picard
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tool=tools/n6-native-domain-frontier-20261015
          {
            python "$tool/test_picard_domain_proof.py"
            python "$tool/picard_domain_proof.py" --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" \
              --kernel-binding "$RUNNER_TEMP/result/ACTUAL_NATURAL_KERNEL_BINDING.json" \
              --majorant "$RUNNER_TEMP/result/ACTUAL_NATURAL_MAJORANT.json" --out "$RUNNER_TEMP/result/PICARD_DOMAIN_PROOF.json"
          } 2>&1 | tee "$RUNNER_TEMP/result/GATE_picard.log"
      - name: Source-bound outer gate
        id: gate_outer
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tool=tools/n6-native-domain-frontier-20261015
          {
            python -m unittest discover -s "$tool" -p test_natural_outer_context_extract.py -v
            python "$tool/natural_outer_context_extract.py" --source-db "$RUNNER_TEMP/result/native-source-cache.sqlite" \
              --stage3 tools/n6-domain-transport-20261015/verify_domain_transport.py --header "$RUNNER_TEMP/source/header.json" \
              --domains "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" --out "$RUNNER_TEMP/result/NATURAL_OUTER_CONTEXTS.json"
            python -m unittest discover -s "$tool" -p test_natural_domain_proof.py -v
            python "$tool/natural_domain_proof.py" --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" \
              --out "$RUNNER_TEMP/result/NATURAL_CONTEXT_RANGE_PROOF.json"
          } 2>&1 | tee "$RUNNER_TEMP/result/GATE_outer.log"
      - name: Source-bound matching gate
        id: gate_matching
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tool=tools/n6-native-domain-frontier-20261015
          {
            node "$tool/actual_natural_b26_probe.mjs" --kernel-root "$PWD" \
              --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" --out "$RUNNER_TEMP/result/ACTUAL_NATURAL_B26_BINDING.json"
            python "$tool/actual_natural_b26_identity.py" --kernels "$RUNNER_TEMP/kernels" \
              --out "$RUNNER_TEMP/result/ACTUAL_NATURAL_B26_IDENTITY.json"
          } 2>&1 | tee "$RUNNER_TEMP/result/GATE_matching.log"
      - name: Source-bound volterra gate
        id: gate_volterra
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tool=tools/n6-native-domain-frontier-20261015
          {
            python "$tool/actual_volterra_denominator_binding.py" --source-db "$RUNNER_TEMP/result/native-source-cache.sqlite" \
              --stage3 tools/n6-domain-transport-20261015/verify_domain_transport.py --header "$RUNNER_TEMP/source/header.json" \
              --compact "$RUNNER_TEMP/prior/COMPACT_JET_PDE_SOURCE.json" --out "$RUNNER_TEMP/result/ACTUAL_VOLTERRA_DENOMINATORS.json"
          } 2>&1 | tee "$RUNNER_TEMP/result/GATE_volterra.log"
      - name: Compose actual Picard regularity and original even profiles
        id: gate_picard_composition
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tool=tools/n6-native-domain-frontier-20261015
          {
            python "$tool/test_actual_picard_parity.py"
            python "$tool/actual_picard_parity.py" --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" \
              --out "$RUNNER_TEMP/result/ACTUAL_PICARD_PARITY.json"
            node "$tool/actual_picard_leading_probe.mjs" --kernel-root "$PWD" \
              --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" --out "$RUNNER_TEMP/result/ACTUAL_PICARD_LEADING_BINDING.json"
            python "$tool/test_picard_interface_lineage.py" --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" \
              --domains "$RUNNER_TEMP/result/PICARD_DOMAIN_PROOF.json"
            python "$tool/picard_interface_lineage.py" --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" \
              --domains "$RUNNER_TEMP/result/PICARD_DOMAIN_PROOF.json" --out "$RUNNER_TEMP/result/PICARD_INTERFACE_LINEAGE.json"
            python "$tool/picard_regularity_composition.py" --domains "$RUNNER_TEMP/result/PICARD_DOMAIN_PROOF.json" \
              --lineage "$RUNNER_TEMP/result/PICARD_INTERFACE_LINEAGE.json" --structure "$RUNNER_TEMP/result/ACTUAL_PICARD_STRUCTURE.json" \
              --natural-binding "$RUNNER_TEMP/result/ACTUAL_NATURAL_KERNEL_BINDING.json" --majorant "$RUNNER_TEMP/result/ACTUAL_NATURAL_MAJORANT.json" \
              --b26-binding "$RUNNER_TEMP/result/ACTUAL_NATURAL_B26_BINDING.json" --b26-identity "$RUNNER_TEMP/result/ACTUAL_NATURAL_B26_IDENTITY.json" \
              --parity "$RUNNER_TEMP/result/ACTUAL_PICARD_PARITY.json" --leading-binding "$RUNNER_TEMP/result/ACTUAL_PICARD_LEADING_BINDING.json" \
              --out "$RUNNER_TEMP/result/ACTUAL_PICARD_REGULARITY_COMPOSITION.json"
          } 2>&1 | tee "$RUNNER_TEMP/result/GATE_picard_composition.log"
      - name: Actual natural radial positivity on the original natural domain
        id: gate_natural_radial_positivity
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/n6-native-domain-frontier-20261015/actual_natural_radial_positivity.py \
            --majorant "$RUNNER_TEMP/result/ACTUAL_NATURAL_MAJORANT.json" \
            --out "$RUNNER_TEMP/result/ACTUAL_NATURAL_RADIAL_POSITIVITY.json" 2>&1 | tee "$RUNNER_TEMP/result/GATE_natural_radial_positivity.log"
      - name: Actual B26 and B34 positive radial shear
        id: gate_b26_b34_positivity
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tool=tools/n6-native-domain-frontier-20261015
          {
            python "$tool/actual_b26_radial_positivity.py" --kernels "$RUNNER_TEMP/kernels" \
              --natural "$RUNNER_TEMP/result/ACTUAL_NATURAL_RADIAL_POSITIVITY.json" \
              --binding "$RUNNER_TEMP/result/ACTUAL_NATURAL_B26_BINDING.json" --out "$RUNNER_TEMP/result/ACTUAL_B26_RADIAL_POSITIVITY.json"
            node "$tool/actual_b34_binding.mjs" --kernel-root "$PWD" \
              --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" --out "$RUNNER_TEMP/result/ACTUAL_B34_BINDING.json"
            python "$tool/actual_b34_radial_positivity.py" --binding "$RUNNER_TEMP/result/ACTUAL_B34_BINDING.json" \
              --b26 "$RUNNER_TEMP/result/ACTUAL_B26_RADIAL_POSITIVITY.json" \
              --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" --out "$RUNNER_TEMP/result/ACTUAL_B34_RADIAL_POSITIVITY.json"
          } 2>&1 | tee "$RUNNER_TEMP/result/GATE_b26_b34_positivity.log"
      - name: Fresh original continuous B8 moment operator
        id: gate_b8_continuous
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python research-ide/mathscope-m1/navier/followup-20261010-symbolic-gluing/certify_symbolic_b8.py \
            --panels 1024 --output "$RUNNER_TEMP/result/ACTUAL_B8_CONTINUOUS_REPLAY.json" 2>&1 | tee "$RUNNER_TEMP/result/GATE_b8_continuous.log"
      - name: Actual B8 incoming debt and independent contraction
        id: gate_b8_incoming
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tool=tools/n6-native-domain-frontier-20261015
          {
            node "$tool/actual_b8_native_probe.mjs" --kernel-root "$PWD" \
              --compact "$RUNNER_TEMP/prior/COMPACT_JET_PDE_SOURCE.json" \
              --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" --out "$RUNNER_TEMP/result/ACTUAL_B8_NATIVE_BINDING.json"
            python "$tool/actual_b8_incoming.py" --replay "$RUNNER_TEMP/result/ACTUAL_B8_CONTINUOUS_REPLAY.json" \
              --binding "$RUNNER_TEMP/result/ACTUAL_B8_NATIVE_BINDING.json" \
              --natural "$RUNNER_TEMP/result/ACTUAL_NATURAL_MAJORANT.json" \
              --natural-radial "$RUNNER_TEMP/result/ACTUAL_NATURAL_RADIAL_POSITIVITY.json" \
              --b26 "$RUNNER_TEMP/result/ACTUAL_B26_RADIAL_POSITIVITY.json" --b34 "$RUNNER_TEMP/result/ACTUAL_B34_RADIAL_POSITIVITY.json" \
              --out "$RUNNER_TEMP/result/ACTUAL_B8_INCOMING.json"
          } 2>&1 | tee "$RUNNER_TEMP/result/GATE_b8_incoming.log"
      - name: Actual completed-leading static moving-frame domains
        id: gate_frozen_frame
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/n6-native-domain-frontier-20261015/actual_frozen_frame_domains.py \
            --source-db "$RUNNER_TEMP/result/native-source-cache.sqlite" \
            --stage3 tools/n6-domain-transport-20261015/verify_domain_transport.py --header "$RUNNER_TEMP/source/header.json" \
            --compact "$RUNNER_TEMP/prior/COMPACT_JET_PDE_SOURCE.json" \
            --out "$RUNNER_TEMP/result/ACTUAL_FROZEN_FRAME_DOMAINS.json" 2>&1 | tee "$RUNNER_TEMP/result/GATE_frozen_frame.log"
      - name: Actual full preloop source S envelope
        id: gate_preloop_envelope
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/n6-native-domain-frontier-20261015/actual_preloop_source_envelope.py \
            --natural "$RUNNER_TEMP/result/ACTUAL_NATURAL_MAJORANT.json" \
            --natural-radial "$RUNNER_TEMP/result/ACTUAL_NATURAL_RADIAL_POSITIVITY.json" \
            --b26 "$RUNNER_TEMP/result/ACTUAL_B26_RADIAL_POSITIVITY.json" --b34 "$RUNNER_TEMP/result/ACTUAL_B34_RADIAL_POSITIVITY.json" \
            --b8 "$RUNNER_TEMP/result/ACTUAL_B8_INCOMING.json" --loop-binding "$RUNNER_TEMP/result/ACTUAL_LOOP_NATIVE_BINDING.json" \
            --diagnostics "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" \
            --out "$RUNNER_TEMP/result/ACTUAL_PRELOOP_SOURCE_ENVELOPE.json" 2>&1 | tee "$RUNNER_TEMP/result/GATE_preloop_envelope.log"
      - name: Actual C1 endpoint collars on the original rectangle
        id: gate_loop_collars
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/n6-native-domain-frontier-20261015/actual_loop_endpoint_collars.py \
            --payload "$RUNNER_TEMP/result/NATIVE_DOMAIN_DIAGNOSTICS.json" \
            --natural "$RUNNER_TEMP/result/ACTUAL_NATURAL_MAJORANT.json" --radial "$RUNNER_TEMP/result/ACTUAL_NATURAL_RADIAL_POSITIVITY.json" \
            --join "$RUNNER_TEMP/result/ACTUAL_NATURAL_B26_IDENTITY.json" --b26-binding "$RUNNER_TEMP/result/ACTUAL_NATURAL_B26_BINDING.json" \
            --loop-binding "$RUNNER_TEMP/result/ACTUAL_LOOP_NATIVE_BINDING.json" \
            --out "$RUNNER_TEMP/result/ACTUAL_C1_ENDPOINT_COLLARS.json" 2>&1 | tee "$RUNNER_TEMP/result/GATE_loop_collars.log"
      - name: Compose actual C1 full rectangle and original finite N C12
        id: gate_c1_c12_composition
        if: ${{ !cancelled() && steps.original_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/n6-native-domain-frontier-20261015/actual_c1_c12_composition.py \
            --natural "$RUNNER_TEMP/result/ACTUAL_NATURAL_MAJORANT.json" \
            --natural-radial "$RUNNER_TEMP/result/ACTUAL_NATURAL_RADIAL_POSITIVITY.json" \
            --b26 "$RUNNER_TEMP/result/ACTUAL_B26_RADIAL_POSITIVITY.json" --b34 "$RUNNER_TEMP/result/ACTUAL_B34_RADIAL_POSITIVITY.json" \
            --b8 "$RUNNER_TEMP/result/ACTUAL_B8_INCOMING.json" --join "$RUNNER_TEMP/result/ACTUAL_NATURAL_B26_IDENTITY.json" \
            --b26-binding "$RUNNER_TEMP/result/ACTUAL_NATURAL_B26_BINDING.json" \
            --loop-binding "$RUNNER_TEMP/result/ACTUAL_LOOP_NATIVE_BINDING.json" --loop-proof "$RUNNER_TEMP/result/ACTUAL_LOOP_REGULARITY.json" \
