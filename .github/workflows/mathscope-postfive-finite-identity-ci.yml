name: MathScope finite cylindrical split integrity (not original proof)
on:
  push:
    branches: [mathscope-m3m4-evidence-gates-20261023]
    paths:
      - 'research-ide/mathscope-m3/post-signed-20261023/verify_cylindrical_split_finite.py'
      - '.github/workflows/mathscope-postfive-finite-identity-ci.yml'
  workflow_dispatch:
jobs:
  exact-polynomial-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic arithmetic
        run: python -m pip install --disable-pip-version-check 'sympy==1.13.3'
      - name: Verify cylindrical direct/split identity without source-proof promotion
        run: |
          set -euo pipefail
          python research-ide/mathscope-m3/post-signed-20261023/verify_cylindrical_split_finite.py | tee finite-identity-receipt.json
          python - <<'PY'
          import json
          r=json.load(open('finite-identity-receipt.json'))
          assert r['component_defects']==['0']*3
          assert r['mutation_control']=='PASS'
          assert r['original_full_field_certified'] is False
          assert r['release']=='HOLD'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: finite-cylindrical-split-control-not-original-proof
          path: finite-identity-receipt.json
          retention-days: 30
