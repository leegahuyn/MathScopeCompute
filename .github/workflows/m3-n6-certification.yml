name: M3 N6 source certification attempts
on:
  push:
    branches: [mathscope-m3-n6-certification-20261014]
    paths: ['research-ide/mathscope-m3/certification-20261014/**', '.github/workflows/m3-n6-certification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-computation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kind: [dag, mean]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record actual runner and immutable ledger
        shell: bash
        env:
          N6_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/n6-$N6_KIND"
          mkdir -p "$out"
          export N6_OUT="$out"
          python - <<'PY'
          import json,os,platform,shutil
          from pathlib import Path
          data={'sourceCommit':os.environ['GITHUB_SHA'],'jobKind':os.environ['N6_KIND'],'cpuCount':os.cpu_count(),'memory':Path('/proc/meminfo').read_text(),'diskFreeBytes':shutil.disk_usage('.').free,'platform':platform.platform(),'runnerLabel':'ubuntu-24.04','paidLargerRunnerUsed':False}
          Path(os.environ['N6_OUT'],'runner.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          git rev-parse HEAD > "$out/source-commit.txt"
          sha256sum research-ide/mathscope-m3/{ORIGINAL_M3_M4_CRITERIA,N6_PROGRESS,N7_PROGRESS,N8_PROGRESS}.json > "$out/ledger-before.sha256"
      - name: Execute independent bounded source computation
        shell: bash
        env:
          N6_KIND: ${{ matrix.kind }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/n6-$N6_KIND"
          src="research-ide/mathscope-m3/certification-20261014"
          if [[ "$N6_KIND" == mean ]]; then
            node --test --test-reporter=tap "$src/replay-kernel.test.mjs" 2>&1 | tee "$out/kernel.tap"
            timeout 2200s node "$src/run_mean.mjs" --output "$out" 2>&1 | tee "$out/stdout.txt"
          elif [[ "$N6_KIND" == dag ]]; then
            timeout 2200s python -B "$src/source_dag.py" --output "$out" 2>&1 | tee "$out/stdout.txt"
          else
            timeout 2200s python -B "$src/$N6_KIND.py" --output "$out" 2>&1 | tee "$out/stdout.txt"
          fi
      - name: Verify ledger remains unchanged and record receipt
        if: always()
        shell: bash
        env:
          N6_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/n6-$N6_KIND"
          sha256sum research-ide/mathscope-m3/{ORIGINAL_M3_M4_CRITERIA,N6_PROGRESS,N7_PROGRESS,N8_PROGRESS}.json > "$out/ledger-after.sha256"
          cmp "$out/ledger-before.sha256" "$out/ledger-after.sha256"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/n6-$N6_KIND-receipt.sha256"
          cp "$RUNNER_TEMP/n6-$N6_KIND-receipt.sha256" "$out/receipt.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n6-certification-${{ matrix.kind }}-${{ github.run_id }}
          path: ${{ runner.temp }}/n6-${{ matrix.kind }}/
          if-no-files-found: error
          retention-days: 90
