# Source-bound continuation; successful execution is required before ledger promotion.
name: N6 remaining source obligations continuation
on:
  push:
    branches: [mathscope-m3-n6-cloud-20261014]
    paths:
      - 'tools/n6-remaining-closure-20261015/*.py'
      - '.github/workflows/m3-n6-remaining-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: n6-remaining-closure-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/n6-remaining-closure-20261015
            tools/n6-direct-discharge-20261015
            tools/n6-domain-transport-20261015
            tools/n6-bump-bridge-20261014
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install sympy==1.14.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38673138045
          name: n6-domain-full-source-38673138045
          path: ${{ runner.temp }}/source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38523108728
          name: n6-finish-prepare-38523108728
          path: ${{ runner.temp }}/prepare
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38529033425
          name: n6-final-summary-38529033425
          path: ${{ runner.temp }}/prior
      - name: Replay original source and verify only established guard statements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          python tools/n6-remaining-closure-20261015/remaining_closure.py \
            --source "$RUNNER_TEMP/source" --prepared "$RUNNER_TEMP/prepare/prepared" \
            --prior "$RUNNER_TEMP/prior" \
            --stage4 tools/n6-direct-discharge-20261015/direct_discharge.py \
            --stage3 tools/n6-domain-transport-20261015/verify_domain_transport.py \
            --bump tools/n6-bump-bridge-20261014/n6_bump_bridge.py \
            --out "$RUNNER_TEMP/result" 2>&1 | tee "$RUNNER_TEMP/result/EXECUTION.log"
      - name: Independent calculus and mutation controls
        working-directory: tools/n6-remaining-closure-20261015
        env:
          N6_SOURCE: ${{ runner.temp }}/source
          N6_PREPARED: ${{ runner.temp }}/prepare/prepared
          N6_PRIOR: ${{ runner.temp }}/prior
          N6_EVIDENCE: ${{ runner.temp }}/result
          N6_STAGE3: ${{ github.workspace }}/tools/n6-domain-transport-20261015/verify_domain_transport.py
        run: |
          python - <<'PY'
          import unittest,json,os,pathlib,platform,sympy
          import test_remaining_closure
          import test_header_binding
          out=pathlib.Path(os.environ['N6_EVIDENCE'])
          suite=unittest.TestSuite([unittest.defaultTestLoader.loadTestsFromModule(m) for m in (test_remaining_closure,test_header_binding)])
          with (out/'TESTS.log').open('w') as f:
              r=unittest.TextTestRunner(stream=f,verbosity=2).run(suite)
          record={'tests':r.testsRun,'passed':r.testsRun-len(r.errors)-len(r.failures),'errors':len(r.errors),'failures':len(r.failures),'successful':r.wasSuccessful(),'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'python':platform.python_version(),'sympy':sympy.__version__,'all1266Closed':False}
          (out/'TESTS.json').write_text(json.dumps(record,indent=2)+'\n')
          print((out/'TESTS.log').read_text());print(json.dumps(record))
          raise SystemExit(not r.wasSuccessful())
          PY
      - name: Extract bounded original source definitions for mathematical review
        run: |
          python tools/n6-remaining-closure-20261015/jet_pde_audit_extract.py \
            --source-db "$RUNNER_TEMP/result/prerequisite-replay/stage3-replay/source-cache.sqlite" \
            --header "$RUNNER_TEMP/source/header.json" \
            --stage3 tools/n6-domain-transport-20261015/verify_domain_transport.py \
            --continuation-module tools/n6-remaining-closure-20261015/remaining_closure.py \
            --jets "$RUNNER_TEMP/result/JET_REQUEST_AUDIT.json" \
            --pde "$RUNNER_TEMP/result/PDE_DEPENDENCY_AUDIT.json" \
            --out "$RUNNER_TEMP/result/COMPACT_JET_PDE_SOURCE.json"
      - name: Record result hashes
        if: always()
        env:
          RESULT: ${{ runner.temp }}/result
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['RESULT']);out.mkdir(exist_ok=True)
          rows=[{'path':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.iterdir()) if p.is_file() and p.suffix in ('.json','.log') and p.name!='RESULT_SHA256.json']
          (out/'RESULT_SHA256.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'files':rows},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n6-remaining-closure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/result/*.json
            ${{ runner.temp }}/result/*.log
          retention-days: 90
          if-no-files-found: error
