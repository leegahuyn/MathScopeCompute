name: N6 Stage4 original guard discharge
on:
  push:
    branches: [mathscope-m3-n6-cloud-20261014]
    paths: ['tools/n6-direct-discharge-20261015/direct_discharge.py','tools/n6-direct-discharge-20261015/test_direct_discharge.py','.github/workflows/m3-n6-direct-discharge.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: n6-direct-discharge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/n6-direct-discharge-20261015
            tools/n6-domain-transport-20261015
            tools/n6-bump-bridge-20261014
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install fixed independent algebra checker
        run: python -m pip install sympy==1.14.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38673138045
          name: n6-domain-full-source-38673138045
          path: ${{ runner.temp }}/stage4-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38523108728
          name: n6-finish-prepare-38523108728
          path: ${{ runner.temp }}/stage4-prepared
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38529033425
          name: n6-final-summary-38529033425
          path: ${{ runner.temp }}/stage4-prior
      - name: Replay prerequisites and discharge only source-proved original guards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage4-evidence"
          python tools/n6-direct-discharge-20261015/direct_discharge.py --source "$RUNNER_TEMP/stage4-source" --prepared "$RUNNER_TEMP/stage4-prepared/prepared" --prior "$RUNNER_TEMP/stage4-prior" --stage3-module "$GITHUB_WORKSPACE/tools/n6-domain-transport-20261015/verify_domain_transport.py" --bump-module "$GITHUB_WORKSPACE/tools/n6-bump-bridge-20261014/n6_bump_bridge.py" --out "$RUNNER_TEMP/stage4-evidence" 2>&1 | tee "$RUNNER_TEMP/stage4-evidence/audit.log"
      - name: Independent symbolic tests and mutation rejection
        working-directory: tools/n6-direct-discharge-20261015
        env:
          N6_SOURCE: ${{ runner.temp }}/stage4-source
          N6_PREPARED: ${{ runner.temp }}/stage4-prepared/prepared
          N6_PRIOR: ${{ runner.temp }}/stage4-prior
          N6_EVIDENCE: ${{ runner.temp }}/stage4-evidence
          N6_STAGE3: ${{ github.workspace }}/tools/n6-domain-transport-20261015/verify_domain_transport.py
          N6_BUMP: ${{ github.workspace }}/tools/n6-bump-bridge-20261014/n6_bump_bridge.py
        run: |
          python - <<'PY'
          import json,os,pathlib,platform,sys,unittest
          import test_direct_discharge
          out=pathlib.Path(os.environ['N6_EVIDENCE'])
          suite=unittest.defaultTestLoader.loadTestsFromModule(test_direct_discharge)
          with (out/'tests.log').open('w') as stream:
              result=unittest.TextTestRunner(stream=stream,verbosity=2).run(suite)
          record={'schema':'MathScope.N6.Stage4.CloudTests/1','run':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'python':platform.python_version(),'tests':result.testsRun,'passed':result.testsRun-len(result.failures)-len(result.errors),'failures':len(result.failures),'errors':len(result.errors),'successful':result.wasSuccessful(),'allOriginalObligationsDischarged':False}
          (out/'TESTS.json').write_text(json.dumps(record,indent=2)+'\n')
          print((out/'tests.log').read_text());print(json.dumps(record))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Preserve actual code and all compact hashes
        if: always()
        working-directory: tools/n6-direct-discharge-20261015
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'stage4-evidence';out.mkdir(exist_ok=True)
          for p in pathlib.Path('.').glob('*.py'):shutil.copyfile(p,out/p.name)
          files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}
          (out/'FILE_HASHES.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n6-stage4-discharge-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stage4-evidence/*.json
            ${{ runner.temp }}/stage4-evidence/*.log
            ${{ runner.temp }}/stage4-evidence/*.py
          retention-days: 90
          if-no-files-found: error
