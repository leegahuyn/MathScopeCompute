name: M3 N6 Picard native-domain bridge audit
on:
  push:
    branches: [mathscope-m3-n6-picard-bridge-20261014]
    paths:
      - 'research-ide/mathscope-m3/picard-bridge-20261014/**'
      - '.github/workflows/m3-n6-picard-bridge.yml'
permissions:
  contents: read
concurrency:
  group: picard-native-bridge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Independent exact n1 source and symbolic K calculation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n6-picard"
          git rev-parse HEAD | tee "$RUNNER_TEMP/n6-picard/source-commit.txt"
          node research-ide/mathscope-m3/picard-bridge-20261014/run_source.mjs "$RUNNER_TEMP/n6-picard/source.json" | tee "$RUNNER_TEMP/n6-picard/node.log"
          python -B research-ide/mathscope-m3/picard-bridge-20261014/verify_majorant.py --input "$RUNNER_TEMP/n6-picard/source.json" --output "$RUNNER_TEMP/n6-picard/result.json" | tee "$RUNNER_TEMP/n6-picard/math.log"
      - name: Strict mutation and scope tests
        env:
          PICARD_BRIDGE_INPUT: ${{ runner.temp }}/n6-picard/source.json
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research-ide/mathscope-m3/picard-bridge-20261014 -p 'test_verify_majorant.py' -v 2>&1 | tee "$RUNNER_TEMP/n6-picard/tests.log"
      - name: Record immutable result hashes
        if: always()
        shell: bash
        run: |
          (cd "$RUNNER_TEMP/n6-picard" && sha256sum *.json *.log 2>/dev/null || true) > "$RUNNER_TEMP/n6-picard/checksums.txt"
          node --version > "$RUNNER_TEMP/n6-picard/node-version.txt"
          python --version > "$RUNNER_TEMP/n6-picard/python-version.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m3-n6-picard-bridge-${{ github.run_id }}
          path: ${{ runner.temp }}/n6-picard/
          retention-days: 90
          if-no-files-found: warn
