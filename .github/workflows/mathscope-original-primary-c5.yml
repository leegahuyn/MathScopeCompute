name: MathScope original Primary C5
on:
  workflow_call:
    inputs:
      with_forced:
        type: boolean
        default: false
  push:
    branches: [mathscope-cd-axial-source-bridge-20261029]
    paths:
      - '.github/workflows/mathscope-original-primary-c5.yml'
      - 'tools/mathscope-cd-axial-bridge-20261029/goal-next/primary-forced-weights/live-c5/run_live_primary_c5.mjs'
      - 'tools/mathscope-cd-axial-bridge-20261029/goal-next/primary-forced-weights/live-c5/prepare_leading_budget.py'
      - 'tools/mathscope-cd-axial-bridge-20261029/goal-next/primary-forced-weights/live-c5/compact-lookup/prepare_background_overlay.py'
      - 'tools/mathscope-cd-axial-bridge-20261029/goal-next/primary-forced-weights/live-c5/compact-lookup/compact_lookup.mjs'
      - 'tools/mathscope-cd-axial-bridge-20261029/goal-next/primary-forced-weights/live-c5/large-pack/*.py'
      - 'tools/mathscope-cd-axial-bridge-20261029/goal-next/primary-forced-weights/live-c5/large-pack/large_pack.mjs'
      - 'tools/mathscope-cd-axial-bridge-20261029/goal-next/primary-forced-weights/live-c5/large-pack/owned_lookup.mjs'
permissions:
  contents: read
jobs:
  original-primary-c5:
    name: Original N${{ matrix.prefix }} Primary C5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.with_forced && '{"include":[{"prefix":3,"nodes":25000000}]}' || '{"include":[{"prefix":3,"nodes":20000000},{"prefix":4,"nodes":25000000}]}') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      ORIGINAL_SOURCE_COMMIT: f8cb4034e86d7b669d52a6f2248aebba156b51b5
      SOURCE_PREFIX: ${{ matrix.prefix }}
      SOURCE_NODE_BUDGET: ${{ matrix.nodes }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: evidence
          persist-credentials: false
          sparse-checkout: |
            research-ide/mathscope-m3/navier
            tools/mathscope-cd-axial-bridge-20261029/goal-next/primary-forced-weights/live-c5
            tools/mathscope-cd-axial-bridge-20261029/goal-next/primary-forced-weights/active-mode-two
            tools/mathscope-cd-axial-bridge-20261029/goal-next/primary-forced-join
            tools/mathscope-cd-axial-bridge-20261029/goal-next/first-force-repair
            tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas
      - uses: actions/checkout@v4
        with:
          ref: f8cb4034e86d7b669d52a6f2248aebba156b51b5
          path: original
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare pinned original source and owned limits
        working-directory: original
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORIGINAL_SOURCE_COMMIT"
          git diff --quiet --exit-code HEAD --
          out="$RUNNER_TEMP/mathscope-primary-c5"
          mkdir -p "$out"
          python3 - "$out/memory.json" "${{ inputs.with_forced && '13824' || '14336' }}" <<'PY'
          import json
          from pathlib import Path
          import sys
          info = dict(line.split(":", 1) for line in Path("/proc/meminfo").read_text().splitlines())
          available = int(info["MemAvailable"].split()[0]) * 1024
          root = Path("/sys/fs/cgroup")
          for limit, usage in (("memory.max", "memory.current"),
                               ("memory/memory.limit_in_bytes", "memory/memory.usage_in_bytes")):
              if (root / limit).exists() and (root / usage).exists():
                  cap = (root / limit).read_text().strip()
                  if cap != "max":
                      available = min(available, int(cap) - int((root / usage).read_text()))
          required = int(sys.argv[2]) * 1024**2
          receipt = {"availableBytes": available, "requiredAvailableBytes": required}
          Path(sys.argv[1]).write_text(json.dumps(receipt) + "\n")
          assert available >= receipt["requiredAvailableBytes"], receipt
          PY
          atlas=../evidence/tools/mathscope-cd-axial-bridge-20261029/goal-next/whole-k-atlas
          python3 "$atlas/prepare_iterative_norm_import.py" . "$out/iterative-norm-import-overlay.json"
          python3 "$atlas/prepare_wider_band_budget.py" research-ide/mathscope-m3/navier/source-global-band.mjs "$out/band-budget-overlay.json" "$SOURCE_NODE_BUDGET"
          python3 "$atlas/prepare_wider_band_budget.py" research-ide/mathscope-m2/navier/actual-residual-order-induction-expressions.mjs "$out/graph-copy-budget-overlay.json" "$SOURCE_NODE_BUDGET"
          live=../evidence/tools/mathscope-cd-axial-bridge-20261029/goal-next/primary-forced-weights/live-c5
          python3 "$live/prepare_leading_budget.py" . "$out/leading-budget-overlay.json"
          issuer=research-ide/mathscope-m2/navier/actual-compact-all-band-background-norms.mjs
          python3 "$live/compact-lookup/prepare_background_overlay.py" \
            --source "$issuer" --out "$out/instrumented-background.mjs" --receipt "$out/background-cache-overlay.json"
          cp "$out/instrumented-background.mjs" "$issuer"
          rm "$out/instrumented-background.mjs"
          python3 "$live/large-pack/prepare_seal_overlays.py" --owned --runtime . \
            --helper "$live/large-pack/large_pack.mjs" --receipt "$out/bounded-seal-overlays.json"
          python3 "$live/large-pack/prepare_large_lower_and_forks.py" . "$out/bounded-lower-overlays.json"
          python3 "$live/large-pack/prepare_primitive_visit_budget.py" . "$out/primitive-visit-budget-overlay.json"
          navier=research-ide/mathscope-m2/navier
          cp "$live/compact-lookup/compact_lookup.mjs" "$navier/mathscope-compact-lookup.mjs"
          cp "$live/large-pack/owned_lookup.mjs" "$navier/mathscope-owned-lookup.mjs"
          node --check research-ide/mathscope-m2/navier/actual-global-source-expressions.mjs
          python3 - "$out" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          root = Path(sys.argv[1])
          overlays = {
              "research-ide/mathscope-m2/navier/actual-residual-order-induction-norms.mjs": "iterative-norm-import-overlay.json",
              "research-ide/mathscope-m3/navier/source-global-band.mjs": "band-budget-overlay.json",
              "research-ide/mathscope-m2/navier/actual-residual-order-induction-expressions.mjs": "graph-copy-budget-overlay.json",
              "research-ide/mathscope-m2/navier/actual-global-source-expressions.mjs": "leading-budget-overlay.json",
              "research-ide/mathscope-m2/navier/actual-compact-all-band-background-norms.mjs": "background-cache-overlay.json",
              "research-ide/mathscope-m2/navier/actual-global-primitive-kernels.mjs": "primitive-visit-budget-overlay.json",
          }
          def digest(data):
              return hashlib.sha256(data).hexdigest()

          expected = {}
          for path, proof in overlays.items():
              receipt = json.loads((root / proof).read_bytes())
              original = subprocess.check_output(["git", "show", "HEAD:" + path])
              assert digest(original) == receipt["oldSHA256" if "oldSHA256" in receipt else "originalSHA256"]
              expected[path] = receipt.get("newSHA256", receipt.get("patchedSHA256"))
          for row in json.loads((root / "bounded-seal-overlays.json").read_bytes())["files"]:
              path = row["file"]
              original = expected.get(path) or digest(subprocess.check_output(["git", "show", "HEAD:" + path]))
              assert row["inputSHA256"] == original and row["exactByteReversal"]
              expected[path] = row["overlaySHA256"]
          for path, row in json.loads((root / "bounded-lower-overlays.json").read_bytes())["files"].items():
              original = expected.get(path) or digest(subprocess.check_output(["git", "show", "HEAD:" + path]))
              assert row["beforeSHA256"] == original and row["reversedToExactInput"]
              expected[path] = row["afterSHA256"]
          modified = subprocess.check_output(["git", "diff", "--name-only", "HEAD", "--"], text=True).splitlines()
          assert set(modified) == set(expected), modified
          for path, pin in expected.items():
              assert digest(Path(path).read_bytes()) == pin
          PY
          runner=research-ide/mathscope-m3/extended-signed-run-20261023/run_live_primary_c5.mjs
          cp "$live/run_live_primary_c5.mjs" "$runner"
          node --check "$runner"
          node --check "$issuer"
          node --check "$navier/actual-global-primitive-kernels.mjs"
          node --check "$navier/mathscope-large-seal.mjs"
          node --check "$navier/mathscope-owned-lookup.mjs"
      - name: Prepare the original Initialized and Forced source
        if: inputs.with_forced
        working-directory: original
        run: |
          set -euo pipefail
          goal=../evidence/tools/mathscope-cd-axial-bridge-20261029/goal-next
          active="$goal/primary-forced-join/active-c5"
          m3=research-ide/mathscope-m3/navier
          out="$RUNNER_TEMP/mathscope-primary-c5"
          cp "$active/capture_source_delta.mjs" "$m3/mathscope-active-forced-seal.mjs"
          python3 -B "$active/prepare_active_first_forced.py" "$m3" "../evidence/$m3" \
            24000000 "$out/forced-preparation.json" --witness
          python3 - "$m3" "$out/forced-preparation.json" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          m3 = Path(sys.argv[1])
          for row in json.loads(Path(sys.argv[2]).read_bytes())["files"]:
              file = m3 / row["file"]
              original = subprocess.check_output(["git", "show", "HEAD:" + file.as_posix()])
              assert hashlib.sha256(original).hexdigest() == row["originalSHA256"]
              assert row["exactStorageAndBudgetReversal"]
              assert hashlib.sha256(file.read_bytes()).hexdigest() == row["outputSHA256"]
          PY
          observer="$goal/primary-forced-join/active-n3-c5-binding/run_same_family_mode_two.mjs"
          node --check "$observer"
          echo "MATHSCOPE_SAME_FAMILY_FORCED_OBSERVER=$(realpath "$observer")" >> "$GITHUB_ENV"
          echo "MATHSCOPE_ACTIVE_N3_SUPPORT=$(realpath "$goal/primary-forced-weights/active-mode-two/active-n3-physical-fast-support.json")" >> "$GITHUB_ENV"
      - name: Build the same-family original C8, weighted C6 and Primary C5
        working-directory: original
        run: |
          set -euo pipefail
          ulimit -s 16384
          out="$RUNNER_TEMP/mathscope-primary-c5"
          node --max-old-space-size=11000 --stack-size=4096 --expose-gc \
            research-ide/mathscope-m3/extended-signed-run-20261023/run_live_primary_c5.mjs \
            "$out" "$ORIGINAL_SOURCE_COMMIT" "$SOURCE_PREFIX" 2>&1 | tee "$out/native-run.log"
      - name: Independently read the selected same-family source graph
        if: inputs.with_forced
        working-directory: original
        run: |
          set -euo pipefail
          goal=../evidence/tools/mathscope-cd-axial-bridge-20261029/goal-next
          out="$RUNNER_TEMP/mathscope-primary-c5"
          sha="$(sha256sum "$out/witness/original-active-mode-two-witness.json" | cut -d ' ' -f 1)"
          python3 -B "$goal/primary-forced-join/active-mode-two-witness/check_active_mode_two.py" \
            --bundle "$out/witness" --checker "$goal/first-force-repair/verify_repaired_first_force.py" \
            --support "$MATHSCOPE_ACTIVE_N3_SUPPORT" --witness-sha "$sha" --out "$out/independent-readback.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathscope-original-n${{ matrix.prefix }}-primary-c5
          path: ${{ runner.temp }}/mathscope-primary-c5/**
          if-no-files-found: warn
          retention-days: 30
