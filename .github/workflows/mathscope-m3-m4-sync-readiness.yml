name: MathScope M3-M4 Sync Readiness Audit

on:
  push:
    branches:
      - mathscope-m3-n6-cloud-20261014
    paths:
      - ".github/workflows/mathscope-m3-m4-sync-readiness.yml"
      - "CHECKPOINT.json"
      - "public/CHECKPOINT.json"
      - "research-ide/mathscope-m3/recovery-20261019/**"
      - "research-ide/mathscope-m4/recovery-20261019/**"
      - "research-ide/mathscope-m4/recovery-20261020/**"
      - "research-ide/mathscope-m4/acceptance-review-20261019/**"
      - "public/v0.3.1-publisher-observation.json"
      - "public/v0.3.1-sync-status.html"
      - "public/websitepublisher-v119-followup-bundle.json"
  pull_request:
    branches:
      - mathscope-m3-n6-independent-20261014
    paths:
      - ".github/workflows/mathscope-m3-m4-sync-readiness.yml"
      - "CHECKPOINT.json"
      - "public/CHECKPOINT.json"
      - "research-ide/mathscope-m3/recovery-20261019/**"
      - "research-ide/mathscope-m4/recovery-20261019/**"
      - "research-ide/mathscope-m4/recovery-20261020/**"
      - "research-ide/mathscope-m4/acceptance-review-20261019/**"
      - "public/v0.3.1-publisher-observation.json"
      - "public/v0.3.1-sync-status.html"
      - "public/websitepublisher-v119-followup-bundle.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathscope-m3-m4-sync-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: One-time explicit English manifest refresh
        if: ${{ hashFiles('research-ide/mathscope-m4/recovery-20261020/REFRESH_ENGLISH_MANIFEST_ONCE') != '' }}
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git rm --ignore-unmatch -f -- research-ide/mathscope-m4/recovery-20261020/REFRESH_ENGLISH_MANIFEST_ONCE .github/workflows/refresh-english-release-manifest.yml
          mkdir -p "$RUNNER_TEMP/mathscope-final-sync"
          python3 research-ide/mathscope-m4/acceptance-review-20261019/sync_m3_m4_and_v031.py --write --report "$RUNNER_TEMP/mathscope-final-sync/STAGING.json"
          node research-ide/mathscope-m4/acceptance-review-20261019/verify_m4_modules.mjs > "$RUNNER_TEMP/mathscope-final-sync/M4_MODULES.json"
          python3 research-ide/mathscope-m4/recovery-20261020/verify_sync_readiness.py --report "$RUNNER_TEMP/mathscope-final-sync/READINESS.json"
          python3 research-ide/tools/verify_english_release.py --write-manifest
          python3 research-ide/tools/verify_english_release.py
          git diff --check
          git add public/websitepublisher-v119-followup-bundle.json public/v0.3.1-sync-status.html research-ide/SOURCE_TRANSLATION_MANIFEST.json
          git add -u
          git diff --cached --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh English release artifact manifest after source validation"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Install verifier dependencies
        run: python -m pip install mpmath sympy

      - name: Verify M3/M4 publication staging artifacts
        id: publication
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/mathscope-publisher-sync"
          python research-ide/mathscope-m4/acceptance-review-20261019/sync_m3_m4_and_v031.py --check --report "$RUNNER_TEMP/mathscope-publisher-sync/STAGING.json"
          node research-ide/mathscope-m4/acceptance-review-20261019/verify_m4_modules.mjs > "$RUNNER_TEMP/mathscope-publisher-sync/M4_MODULES.json"

      - name: Run bounded native, cutoff, and M4 scoped recovery checks
        id: scoped
        continue-on-error: true
        run: |
          python research-ide/mathscope-m4/recovery-20261019/run_all_scoped.py \
            --output-dir "$RUNNER_TEMP/mathscope-scoped-audit"

      - name: Re-run source-pinned outer-cutoff computation
        id: cutoff
        continue-on-error: true
        run: |
          python research-ide/mathscope-m3/recovery-20261019/run_outer_cutoff.py \
            --grid 8 --precision 80 \
            --output "$RUNNER_TEMP/mathscope-cutoff-replay"
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "mathscope-cutoff-replay"
          receipt = json.loads((out / "OUTER_CUTOFF_RUN.json").read_text())
          assert receipt["run_hash"] == "e2aa3bdf3d252cb1f19140d85fb747a663a28a87e38904917fc5ea1427fae322"
          assert receipt["source_pins_unchanged"] is True
          assert receipt["original_field_jets_remaining"] == 67
          assert receipt["actual_nonzero_field_evaluated"] is False
          assert receipt["N706_closed"] is False and receipt["N805_closed"] is False
          assert receipt["actual_last_resolved_tau"] is None
          print(json.dumps({
              "status": "PASS_FINITE_CUTOFF_SCOPE_ONLY",
              "run_hash": receipt["run_hash"],
              "cells": receipt["grid_results"],
              "original_field_jets_remaining": receipt["original_field_jets_remaining"],
              "N706_closed": receipt["N706_closed"],
              "N805_closed": receipt["N805_closed"],
              "actual_last_resolved_tau": receipt["actual_last_resolved_tau"]
          }, indent=2))
          PY

      - name: Verify saved ledger, evidence digests, and HOLD consistency
        id: readiness
        continue-on-error: true
        run: |
          python research-ide/mathscope-m4/recovery-20261020/verify_sync_readiness.py \
            --report "$RUNNER_TEMP/mathscope-sync-readiness/REPORT.json"

      - name: Upload reproducible execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathscope-m3-m4-sync-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mathscope-scoped-audit/
            ${{ runner.temp }}/mathscope-cutoff-replay/
            ${{ runner.temp }}/mathscope-sync-readiness/
            ${{ runner.temp }}/mathscope-publisher-sync/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the workflow if a verifier failed
        if: always()
        env:
          SCOPED_OUTCOME: ${{ steps.scoped.outcome }}
          CUTOFF_OUTCOME: ${{ steps.cutoff.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
        run: |
          printf 'scoped=%s cutoff=%s readiness=%s publication=%s\n' "$SCOPED_OUTCOME" "$CUTOFF_OUTCOME" "$READINESS_OUTCOME" "$PUBLICATION_OUTCOME"
          test "$SCOPED_OUTCOME" = "success"
          test "$CUTOFF_OUTCOME" = "success"
          test "$READINESS_OUTCOME" = "success"
          test "$PUBLICATION_OUTCOME" = "success"
