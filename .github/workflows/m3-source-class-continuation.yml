name: M3 coherent source class continuation

on:
  workflow_dispatch:
  push:
    branches: [mathscope-m3-continuation55-20261012]
    paths:
      - '.github/workflows/m3-source-class-continuation.yml'

permissions:
  contents: read

concurrency:
  group: m3-coherent-source-class-continuation
  cancel-in-progress: false

jobs:
  original-coherent-source-classes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      M3_CLASS_CI_ATTEMPT: ${{ github.run_id }}${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record runtime and verify the complete coherent input family
        run: |
          M3_CLASS_CI_DIAGNOSTICS="$RUNNER_TEMP/m3-source-class-diagnostics"
          mkdir -p "$M3_CLASS_CI_DIAGNOSTICS"
          printf '%s\n' "M3_CLASS_CI_DIAGNOSTICS=$M3_CLASS_CI_DIAGNOSTICS" >> "$GITHUB_ENV"
          node --version | tee "$M3_CLASS_CI_DIAGNOSTICS/node-version.txt"
          python --version | tee "$M3_CLASS_CI_DIAGNOSTICS/python-version.txt"
          python -B - <<'PY' | tee "$M3_CLASS_CI_DIAGNOSTICS/frozen-source-inputs.json"
          from pathlib import Path
          import hashlib, json, os
          path = Path('research-ide/mathscope-m3/navier/evidence/global-source-class-composition-20261012/ci-preflight/ready-retry3.json')
          raw = path.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '7a00066bf402a075de031015c3cc681422bac1bbad2c1840aa00c75fc5dd8421'
          record = json.loads(raw)
          rows = record['sourceFiles']
          assert len(rows) == 146 and record['expectedNodeTests'] == 14
          for row in rows:
              actual = Path(row['path']).read_bytes()
              assert len(actual) == row['bytes'], row['path']
              assert hashlib.sha256(actual).hexdigest() == row['sha256'], row['path']
          print(json.dumps({'status': 'PASS', 'commit': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'sourceFileCount': len(rows), 'readyRecordSHA256': hashlib.sha256(raw).hexdigest(), 'sameFixedLimits': record['limits'], 'coherentOrders': record['coherentOrders'], 'actualSourceGatePassInferredFromPreflight': False}, indent=2))
          PY
      - name: Execute actual C4 family and the complete common-Y pressure composition
        run: |
          python -B research-ide/mathscope-m3/navier/tests/run-global-source-class-composition.py --attempt "$M3_CLASS_CI_ATTEMPT" \
            2>&1 | tee "$M3_CLASS_CI_DIAGNOSTICS/driver.log"
      - name: Preserve completed and partial class evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-source-class-ci${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/m3-source-class-diagnostics/
            research-ide/mathscope-m3/navier/evidence/global-source-class-composition-20261012/attempt${{ env.M3_CLASS_CI_ATTEMPT }}/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
