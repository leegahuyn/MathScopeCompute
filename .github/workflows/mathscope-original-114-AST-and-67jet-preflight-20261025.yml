name: MathScope full-source 114 X-call replay and 67-jet preflight (HOLD)
on:
  push:
    branches: [mathscope-m3m4-evidence-gates-20261023]
    paths:
      - '.github/workflows/mathscope-original-114-AST-and-67jet-preflight-20261025.yml'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/audit_original_114_ast_call_ledger.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/test_audit_original_114_ast_call_ledger.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/audit_original_114_first_AST_piecewise_guards.py'
      - 'research-ide/mathscope-m3/closure-evidence-20261023/test_audit_original_114_first_AST_piecewise_guards.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-114-source-ast-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable first FiveMap 4.42M source graph from original CI
        uses: actions/download-artifact@v4
        with:
          name: authenticated-first-fivemap-full-source-dag-replay-not-final-67
          run-id: 39988632325
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source
      - name: Download correct Cor85 source receipt for the source-67 readiness gate
        uses: actions/download-artifact@v4
        with:
          name: mathscope-authentic-pr30-forced-cor85-signed162-evidence
          run-id: 39899886766
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cor85
      - name: Download actual Signed162 + post-Signed Temporal receipt
        uses: actions/download-artifact@v4
        with:
          name: authentic-signed162-real-native-field-and-post-five-checkpoint
          run-id: 39933504384
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed
      - name: Verify original 114 graph calls and 67+13 conditional preflight
        env:
          MATHSCOPE_GRAPH_DIR: ${{ runner.temp }}/source/first-post-five-source-graph
          REAL_RECEIPT_FILE: ${{ runner.temp }}/cor85/m3-real-signed162-attempt.json
          ACTUAL_SIGNED_CI_RECEIPT: ${{ runner.temp }}/signed/m3-original-signed-temporal-five-after-native-field-fix.json
        working-directory: research-ide/mathscope-m3/closure-evidence-20261023
        run: |
          python -m unittest -v test_audit_original_114_ast_call_ledger.py test_audit_original_114_first_AST_piecewise_guards.py test_compile_original_67jet_force_stencil.py test_conditional_67jet_force_intervals.py test_real_67jet_readiness.py test_67jet_after_actual_signed.py
          python audit_original_114_ast_call_ledger.py --graph-dir "$MATHSCOPE_GRAPH_DIR" --output "$RUNNER_TEMP/ORIGINAL_114_AST_NODE_LEDGER.json"
          python audit_original_114_first_AST_piecewise_guards.py --graph-dir "$MATHSCOPE_GRAPH_DIR" --output "$RUNNER_TEMP/ORIGINAL_114_FIRST_SYNTACTIC_BRANCHES.json"
          python verify_real_67jet_readiness.py --actual-receipt "$REAL_RECEIPT_FILE" --output "$RUNNER_TEMP/ORIGINAL_PRE_SIGNED_67_READINESS.json"
          python verify_67jet_after_actual_signed.py --receipt "$ACTUAL_SIGNED_CI_RECEIPT" --output "$RUNNER_TEMP/ORIGINAL_POST_SIGNED_67_READINESS.json"
          set +e
          python verify_67jet_after_actual_signed.py --receipt "$ACTUAL_SIGNED_CI_RECEIPT" --output "$RUNNER_TEMP/POST_SIGNED_67_REQUIRED_NEGATIVE.json" --require-67
          code=$?
          if [ "$code" -ne 2 ]; then echo "ERROR: incorrectly accepted missing final physical 67 intervals ($code)"; exit 1; fi
          echo "FINAL_67_JETS_MISSING_FAIL_CLOSED"
          set -e
      - name: Upload verified original AST inventory (NOT support or jet proof)
        uses: actions/upload-artifact@v4
        with:
          name: original-114-AST-inventory-source-verified-OPEN-Y-HOLD
          path: |
            ${{ runner.temp }}/ORIGINAL_114_AST_NODE_LEDGER.json
            ${{ runner.temp }}/ORIGINAL_114_FIRST_SYNTACTIC_BRANCHES.json
            ${{ runner.temp }}/ORIGINAL_PRE_SIGNED_67_READINESS.json
            ${{ runner.temp }}/ORIGINAL_POST_SIGNED_67_READINESS.json
            ${{ runner.temp }}/POST_SIGNED_67_REQUIRED_NEGATIVE.json
