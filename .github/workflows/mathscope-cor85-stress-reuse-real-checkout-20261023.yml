name: M3 Cor85 same-private-seal reuse Signed 162 source regression
on:
  push:
    branches: [mathscope-m3m4-evidence-gates-20261023]
    paths:
      - '.github/workflows/mathscope-cor85-stress-reuse-real-checkout-20261023.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-full-checkout-same-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply immutable PR30 Signed and explicit authenticated Cor85 provenance reuse
        run: |
          set -euo pipefail
          git apply --check research-ide/mathscope-m3/staged-patches-20261023/PR30_Cumulative_Signed162_Cor85_TemporalFrontier.patch
          git apply research-ide/mathscope-m3/staged-patches-20261023/PR30_Cumulative_Signed162_Cor85_TemporalFrontier.patch
          git apply --check research-ide/mathscope-m3/temporal-finite-20261023/PR30_Cor85_SameSeal_NoDuplicate.patch
          git apply research-ide/mathscope-m3/temporal-finite-20261023/PR30_Cor85_SameSeal_NoDuplicate.patch
          git apply research-ide/mathscope-m3/pin-test-hotfix-20261023/PR30_RealCheckout_PinTest_EnvPortable.patch
          cp research-ide/mathscope-m3/tangency-proof-20261023/generic-signed-source-kernel.fixed.mjs research-ide/mathscope-m3/navier/generic-signed-source-kernel.mjs
          cp research-ide/mathscope-m3/tangency-proof-20261023/signed-source-frame-tangency.mjs research-ide/mathscope-m3/navier/signed-source-frame-tangency.mjs
          cp research-ide/mathscope-m3/tangency-proof-20261023/signed-source-frame-tangency.test.mjs research-ide/mathscope-m3/tests/signed-source-frame-tangency.test.mjs
          node --input-type=module -e "import {verifyPR30OriginalSourceFiles} from './research-ide/mathscope-m3/navier/source-signed-162-pr30-pins.mjs'; const x=await verifyPR30OriginalSourceFiles(); if(x.verifiedFiles.length!==29)process.exit(2); console.log('ORIGINAL_29_PRIVATE_PROVENANCE_FILES_PINNED')"
      - name: Run all Signed source/private seal and original source regression
        run: |
          set -euo pipefail
          node --test --test-reporter=tap --test-concurrency=1 research-ide/mathscope-m3/tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/cor85-same-private-seal.tap"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathscope-cor85-privately-bound-reused-stress-tests
          path: ${{ runner.temp }}/cor85-same-private-seal.tap
          if-no-files-found: warn
          retention-days: 30
