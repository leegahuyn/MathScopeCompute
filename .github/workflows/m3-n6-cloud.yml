name: M3 N6 cloud-only original source verification
on:
  push:
    branches: [mathscope-m3-n6-cloud-20261014]
    paths: ['research-ide/mathscope-m3/n6-cloud-20261014/**', '.github/workflows/m3-n6-cloud.yml']
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Optional prior run ID; only byte-verified matching checkpoints and completed shards are reused'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: n6-cloud-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.resume_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
          pattern: n6-cloud-prepare-${{ inputs.resume_run_id }}
          path: ${{ runner.temp }}/resume
      - name: Verify source archives once and prepare shared bounded checkpoint
        run: python -B research-ide/mathscope-m3/n6-cloud-20261014/run_job.py --kind prepare --output "$RUNNER_TEMP/n6-prepare" --resume "$RUNNER_TEMP/resume"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n6-cloud-prepare-${{ github.run_id }}
          path: ${{ runner.temp }}/n6-prepare/
          retention-days: 90
          if-no-files-found: error
  calculate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {kind: jet, shard: 0}
          - {kind: jet, shard: 1}
          - {kind: jet, shard: 2}
          - {kind: jet, shard: 3}
          - {kind: residual, shard: 0}
          - {kind: residual, shard: 1}
          - {kind: residual, shard: 2}
          - {kind: guard, shard: 0}
          - {kind: bounds, shard: 0}
          - {kind: controls, shard: 0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: n6-cloud-prepare-${{ github.run_id }}
          path: ${{ runner.temp }}/n6-prepare
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.resume_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
          pattern: n6-cloud-${{ matrix.kind }}-${{ matrix.shard }}-${{ inputs.resume_run_id }}
          path: ${{ runner.temp }}/resume
      - name: Compute original requests with RAM and CPU budgets
        env:
          N6_KIND: ${{ matrix.kind }}
          N6_SHARD: ${{ matrix.shard }}
        run: python -B research-ide/mathscope-m3/n6-cloud-20261014/run_job.py --kind "$N6_KIND" --shard "$N6_SHARD" --prepared "$RUNNER_TEMP/n6-prepare/prepared" --output "$RUNNER_TEMP/n6-result" --resume "$RUNNER_TEMP/resume"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n6-cloud-${{ matrix.kind }}-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/n6-result/
          retention-days: 90
          if-no-files-found: error
  acceptance:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, calculate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      completed: ${{ steps.check.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: n6-cloud-*-${{ github.run_id }}
          path: ${{ runner.temp }}/same-run
      - id: check
        name: Verify every available shard and preserve failures in strict acceptance ledger
        run: python -B research-ide/mathscope-m3/n6-cloud-20261014/run_job.py --kind acceptance --prepared "$RUNNER_TEMP/same-run/n6-cloud-prepare-$GITHUB_RUN_ID/prepared" --results "$RUNNER_TEMP/same-run" --output "$RUNNER_TEMP/n6-acceptance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n6-cloud-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/n6-acceptance/
          retention-days: 90
          if-no-files-found: error
  preserve:
    if: always() && needs.acceptance.result != 'skipped'
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: n6-cloud-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/accepted
      - name: Commit compact results and certificate hashes to this child branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B research-ide/mathscope-m3/n6-cloud-20261014/preserve.py --result "$RUNNER_TEMP/accepted"
