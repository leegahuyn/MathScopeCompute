name: M3 N6 dedicated remaining obligations
permissions:
  contents: read
  actions: read
concurrency:
  group: n6-finish-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  NODE_OPTIONS: --max-old-space-size=2048
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.10
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.19.0
    - name: Prepare verified original inputs and only the current unsolved frontier
      run: python -B research-ide/mathscope-m3/n6-finish-20261014/run_job.py --kind prepare --output "$RUNNER_TEMP/n6-prepare"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: n6-finish-prepare-${{ github.run_id }}
        path: ${{ runner.temp }}/n6-prepare/
        retention-days: 90
        if-no-files-found: error
  calculate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
        - kind: jet
          shard: 0
        - kind: jet
          shard: 1
        - kind: jet
          shard: 2
        - kind: jet
          shard: 3
        - kind: pde
          shard: 0
        - kind: pde
          shard: 1
        - kind: pde
          shard: 2
        - kind: guard
          shard: 0
        - kind: controls
          shard: 0
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.10
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.19.0
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: n6-finish-prepare-${{ github.run_id }}
        path: ${{ runner.temp }}/n6-prepare
    - name: Compute original requests with RAM and CPU budgets
      env:
        N6_KIND: ${{ matrix.kind }}
        N6_SHARD: ${{ matrix.shard }}
      run: python -B research-ide/mathscope-m3/n6-finish-20261014/run_job.py --kind "$N6_KIND" --shard "$N6_SHARD" --prepared "$RUNNER_TEMP/n6-prepare/prepared"
        --output "$RUNNER_TEMP/n6-result"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: n6-finish-${{ matrix.kind }}-${{ matrix.shard }}-${{ github.run_id }}
        path: ${{ runner.temp }}/n6-result/
        retention-days: 90
        if-no-files-found: error
  acceptance:
    if: always() && needs.prepare.result == 'success'
    needs:
    - prepare
    - calculate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      completed: ${{ steps.check.outcome }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.10
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.19.0
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: n6-finish-*-${{ github.run_id }}
        path: ${{ runner.temp }}/same-run
    - id: check
      name: Verify every available shard and preserve failures in strict acceptance ledger
      run: python -B research-ide/mathscope-m3/n6-finish-20261014/run_job.py --kind acceptance --prepared "$RUNNER_TEMP/same-run/n6-finish-prepare-$GITHUB_RUN_ID/prepared"
        --results "$RUNNER_TEMP/same-run" --output "$RUNNER_TEMP/n6-acceptance"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: n6-finish-acceptance-${{ github.run_id }}
        path: ${{ runner.temp }}/n6-acceptance/
        retention-days: 90
        if-no-files-found: error
  preserve:
    if: always() && needs.acceptance.result != 'skipped'
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.10
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: n6-finish-acceptance-${{ github.run_id }}
        path: ${{ runner.temp }}/accepted
    - name: Commit compact results and certificate hashes to this child branch only
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -B research-ide/mathscope-m3/n6-finish-20261014/preserve.py --result "$RUNNER_TEMP/accepted"
'on':
  push:
    branches:
    - mathscope-m3-n6-cloud-20261014
    paths:
    - research-ide/mathscope-m3/n6-finish-20261014/**
    - .github/workflows/m3-n6-finish.yml
  workflow_dispatch: {}
