name: M3 saved forced-current rendered browser verification

on:
  workflow_dispatch:
  push:
    branches: [mathscope-m3-continuation55-20261012]
    paths:
      - '.github/workflows/m3-forced-browser-continuation.yml'
      - 'research-ide/mathscope-m3/web/tests/forced-current-browser.mjs'
      - 'research-ide/mathscope-m3/evidence/all64-20261012/release56/candidate-pages.json'

permissions:
  contents: read

jobs:
  saved-forced-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the exact browser bundle and original criterion bindings
        run: |
          python -B research-ide/mathscope-m3/web/build_extended.py --check
          python -B research-ide/mathscope-m3/web/tests/test_extended_build.py
          node --test research-ide/mathscope-m3/navier/tests/global-forced-archive.test.mjs research-ide/mathscope-m3/web/tests/navier-source-forced-current-view.test.mjs
      - name: Install the isolated pinned browser runtime
        run: |
          M3_BROWSER_RUNTIME="$RUNNER_TEMP/m3-rendered-browser-runtime"
          npm install --prefix "$M3_BROWSER_RUNTIME" --no-save --no-package-lock playwright@1.62.1
          "$M3_BROWSER_RUNTIME/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          printf '%s\n' "M3_PLAYWRIGHT_PACKAGE=$M3_BROWSER_RUNTIME/node_modules/playwright" >> "$GITHUB_ENV"
          printf '%s\n' "M3_BROWSER_EVIDENCE=$RUNNER_TEMP/m3-forced-browser-evidence" >> "$GITHUB_ENV"
      - name: Execute the actual candidate page on desktop and mobile
        run: node research-ide/mathscope-m3/web/tests/forced-current-browser.mjs
      - name: Preserve the complete rendered evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-forced-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/m3-forced-browser-evidence/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
