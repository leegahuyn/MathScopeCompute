services:
  - type: web
    name: mathscope-compute
    runtime: python
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MATHSCOPE_ALLOWED_ORIGINS
        value: https://project29770.websitepublisher.ai,http://localhost:3000,http://localhost:5173
